[package]
name = "runtime-core"
version = "0.1.8"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "macros"] }
async-trait = "0.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.8"
