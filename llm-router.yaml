      atomic_composition_outline:
        default: gpt6luna-responses-toolsany
        description: "Drafts the outline used before detailed atomic composition."
        group: "Planning & execution"
      atomic_composition:
        default: gpt61sol-responses-toolsany-rhigh
        description: "Builds the detailed atomic action composition for an execution."
        group: "Planning & execution"
      tool_evaluation:
        default: gpt6luna-responses-toolsany
        description: "Evaluates candidate tools for a requested capability."
        group: "Planning & execution"
      # Taste-profile distillation: reads a finished session and proposes
      # standing directives. Bound to the Luna tier because this is bounded
      # extraction — the same shape as category_matching below — and it runs
      # once per finished session, not per turn. Not required to be local: the
      # transcript already went to whichever model conducted the session.
      # UNBOUND MEANS CAPTURE IS OFF; the router default is never used here.
      taste_profile_distill:
        default: gpt6luna-chat-toolsany-rnone
        description: "Distills interaction signals into the user's taste profile."
        group: "Learning"
      # Slice 3 stage-2 applicability judge. Runs per run/resume/steer behind a
      # 3s timeout, so it is bound to the cheapest/fastest tier deliberately —
      # its worst case is added to every run's time-to-first-token. On timeout,
      # error, or unbound it falls back to stage-1 tag ranking, which is a real
      # ranking and ships as the default. UNBOUND MEANS THE JUDGE IS OFF.
      memory_applicability_judge:
        default: gpt6luna-chat-toolsany-rnone
        description: "Decides whether a memory is relevant to the current request."
        group: "Memory"
