    operation_mapping:
      # Reviewed Town Square steps follow the selected app-processing mode.
      "app:engagement_gate":
        default: op-app-workflow-local
        when_cloud: op-app-workflow-remote
        description: "Judges whether the owning app should engage with a candidate item."
        group: "Apps"
      "app:compose_post":
        default: op-app-workflow-local
        when_cloud: op-app-workflow-remote
        description: "Lets the owning app compose a post from admitted app data."
        group: "Apps"
      chat_completion:
        default: chat-openai-adaptive-instant
        when_has_images: chat-openai-adaptive-instant
        description: "Produces the main Magician chat response."
        group: "Chat"
      # App query results use the reviewed local/cloud app-workflow profile.
      # Chat ignores per-turn profile overrides whenever an app-data tool is
      # in the admitted catalog.
      app_data_processing:
        default: op-app-workflow-local
        when_cloud: op-app-workflow-remote
        description: "Processes app-owned data through the admitted app LLM boundary."
        group: "Apps"
      # Loom/Thinking Map is intentionally isolated on the bounded Luna chat
      # profile. The runtime accepts only OpenAI GPT-5.6 Terra/Luna here.
      brainstorm_facilitation:
        default: chat-gpt6luna-responses-vision-toolsauto-fast
        description: "Facilitates Loom and Thinking Map brainstorming turns."
        group: "Chat"
      kapso_envoy_chat:
        default: chat-gpt6luna-responses-vision-toolsauto-fast
        description: "Produces the primary public envoy chat response."
        group: "Channels"
      kapso_envoy_chat_fallback:
        default: op-kapso-envoy-chat-fallback-local
        when_cloud: op-kapso-envoy-chat-fallback-remote
        description: "Produces the fallback public envoy chat response."
        group: "Channels"
      task_decomposition:
        default: gpt61sol-responses-toolsany
        description: "Breaks a request into executable tasks and dependencies."
        group: "Planning & execution"
      query_analysis:
        default: gpt6luna-responses-toolsany
        description: "Analyzes request intent, complexity, dependencies, and required capabilities."
        group: "Planning & execution"
      entity_mapping:
        default: gpt6luna-responses-toolsany-rnone
        description: "Maps extracted entities into structured task fields."
