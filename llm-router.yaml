# Magician LLM router tables: `profiles` and `operation_mapping`.
#
# Spliced into `magician-config.yaml` under `llm.router` when the config
# is loaded, as TEXT rather than as a merged document — the block aliases
# `*local_generation_model`, whose anchor is defined in `runtime:` of the main
# config, and YAML anchors do not cross files. Splicing keeps it one document at
# parse time, so the alias resolves untouched.
#
# That also means this file is NOT valid YAML on its own. Edit it as the body of
# `llm.router.profiles`, keeping the four-space indent of the `profiles:` key.
#
# Resolved as a sibling of whichever config was loaded, so a live runtime config
# can never pair with the repository's profiles. A missing or unparseable file
# is fatal, not a warning: unlike `llm_pricing.json`, which overlays built-in
# rates, there are no built-in profiles — booting without them would leave the
# router with nothing to route to.

    profiles:
      gptluna-chat-toolsany-rnone:
        provider: openai
        model: gpt-5.6-luna
        api_key_env: OPENAI_API_KEY
        supports_tool_calling: true
        max_output_tokens: 32768
        timeout_secs: 600
        metadata:
          openai_api_mode: chat
          tool_choice:
            type: any

      # GPT-6 equivalent of gptluna-chat-toolsany-rnone.
      gpt6luna-chat-toolsany-rnone:
        provider: openai
        model: gpt-6-luna
        api_key_env: OPENAI_API_KEY
        supports_tool_calling: true
        max_output_tokens: 32768
        timeout_secs: 600
        metadata:
          openai_api_mode: chat
          tool_choice:
            type: any

      gptterra-chat-toolsany-rnone:
        provider: openai
        model: gpt-5.6-terra
        api_key_env: OPENAI_API_KEY
        supports_tool_calling: true
        max_output_tokens: 32768
        timeout_secs: 600
        metadata:
          openai_api_mode: chat
          tool_choice:
            type: any

      gptsol-responses-toolsany-rhigh-out64k:
        provider: openai
        model: gpt-5.6-sol
        api_key_env: OPENAI_API_KEY
        supports_reasoning: true
        supports_tool_calling: true
        max_output_tokens: 65536
        timeout_secs: 600
        reasoning:
          effort: high
        metadata:
          openai_api_mode: responses
          tool_choice:
            type: any
          verbosity: low

      # GPT-6 equivalent of gptsol-responses-toolsany-rhigh-out64k.
      gpt61sol-responses-toolsany-rhigh-out64k: &profile_gpt61sol_responses_toolsany_rhigh_out64k
        provider: openai
        model: gpt-6.1-sol
        api_key_env: OPENAI_API_KEY
        supports_reasoning: true
        supports_tool_calling: true
        max_output_tokens: 65536
        timeout_secs: 600
        reasoning:
          effort: high
        metadata:
          openai_api_mode: responses
          tool_choice:
            type: any
          verbosity: low

      gptsol-responses-toolsnone-rhigh-out64k:
        provider: openai
        model: gpt-5.6-sol
        api_key_env: OPENAI_API_KEY
        supports_reasoning: true
        supports_tool_calling: true
        max_output_tokens: 65536
        timeout_secs: 600
        reasoning:
          effort: high
        metadata:
          openai_api_mode: responses
          tool_choice:
            type: none
          verbosity: low

      # GPT-6 equivalent of gptsol-responses-toolsnone-rhigh-out64k.
      gpt61sol-responses-toolsnone-rhigh-out64k: &profile_gpt61sol_responses_toolsnone_rhigh_out64k
        provider: openai
        model: gpt-6.1-sol
        api_key_env: OPENAI_API_KEY
        supports_reasoning: true
        supports_tool_calling: true
        max_output_tokens: 65536
        timeout_secs: 600
        reasoning:
          effort: high
        metadata:
          openai_api_mode: responses
          tool_choice:
            type: none
          verbosity: low

      gptastra-responses-toolsany-rhigh-out64k:
        provider: openai
