    # Default profile used when no operation mapping matches. Stays on
    # a standard profile — adaptive escalation is a chat-runtime
    # feature only (see `chat/service.rs::process_chat_inline_turn`).
    # Non-chat operations don't run the escalation interceptor, so
    # pointing `default_profile` at an adaptive composite would just
    # collapse to its `fast_profile` via `resolve_adaptive_to_fast`
    # — visually misleading without any behavioral upside. Chat itself
    # picks adaptive through `operation_mapping.chat_completion`.
    #
    # `gpt61sol-responses-toolsany` is the active unrouted-operation default:
    # gpt-5.6-terra with `reasoning.effort: medium`, `tool_choice: any`,
    # 32K output. Cheap reasoning-capable fallback for unrouted ops.
