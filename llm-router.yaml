      # Meeting/observation transcript → prose summary. Local Ollama keeps
      # whole-meeting transcripts on-device (the pre-router behavior:
      # MEET_BOT_OLLAMA_URL/MEET_BOT_SUMMARY_MODEL env — now a profile).
      # MUST stay on the native `ollama` provider, NOT an OpenAI-compat
      # detour: providers are instantiated ONE PER PROVIDER KIND from an
      # arbitrary representative profile, so a second `openai` profile
      # with a custom api_base_url either loses its URL (requests go to
      # api.openai.com — caught live: summary 404'd against OpenAI) or,
      # worse, hijacks ALL openai traffic to localhost depending on
      # iteration order. The lone ollama-kind profile owns its base URL
      # safely. `supports_tool_calling: true` satisfies the blanket
      # config invariant; the ollama provider rejects tool-bearing
      # requests loudly at call time (summaries send none).
      # Task-result card/list metadata is auxiliary and runs after the primary
      # answer is durable + projected. Keep it off the single-slot Ollama lane:
      # Luna is cheap/fast, needs no tools, and reasoning is unnecessary here.
      op-task-summary-luna:
        provider: openai
        model: gpt-6-luna
        api_key_env: OPENAI_API_KEY
        supports_reasoning: true
        supports_tool_calling: true
        max_output_tokens: 2048
        timeout_secs: 120
        reasoning:
          effort: none
        metadata:
          openai_api_mode: responses
          tool_choice:
            type: none
          verbosity: low

      op-meeting-summary-local:
        provider: ollama
        context_window_tokens: 32768
        chunking:
          enabled: false
        model: *local_generation_model  # Unsloth Dynamic 3.0 Qwen3.8-27B UD-Q2_K_XL + MTP. See docs/components/magician/local-channel-llm.md.
        # FULL endpoint URL, not the host root — the ollama provider's
        # `api_base_url` replaces its whole default endpoint
        # (http://localhost:11434/api/generate). The host root alone
        # gets ollama's plain-text `404 page not found`, which surfaces
        # as `serialization: trailing characters at line 1 column 5`.
        api_base_url: http://localhost:11434/api/generate
        supports_tool_calling: true
        max_output_tokens: 16384
        timeout_secs: 300
        metadata:
          options:
            num_ctx: 32768
            draft_num_predict: 4
          tool_choice:
            type: none

