        model: grok-4
        timeout_secs: 300
      op-harness-agy-medium:
        provider: harness-agy
        model: gemini-3.7-flash-medium
        timeout_secs: 300
      op-harness-agy-high:
        provider: harness-agy
        model: gemini-3.7-flash-high
