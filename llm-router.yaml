      # ── Harness CLI profiles (2026-08-31 plan) ──────────────────────────
      # Subscription-backed model calls: `invoke` is a one-shot call to an
      # installed, user-signed-in CLI. Text-in/text-out only — no tools, no
      # MCP, no plane. These profiles exist as CHOICES; by the plan's
      # no-override guarantee NO operation maps to them in shipped defaults,
      # and local models (Ollama) and API profiles remain selectable for
      # every operation. To ride the subscription for one operation, add
      # exactly one line under operation_mapping, e.g.:
      #   meeting_summary: op-harness-claude
      # Reverting is deleting that line. These profiles must never back an
      # execution-native operation or an agent/model override: the execution
      # router refuses profiles without explicit tool-calling support before
      # provider dispatch. Sensitive and agentic operations stay on local/API
      # profiles; nothing here can displace them silently.
      op-harness-claude:
        provider: harness-claude_code
        model: default
        timeout_secs: 300
      op-harness-codex:
        provider: harness-codex
        model: default
        timeout_secs: 300
      op-harness-grok:
        provider: harness-grok
        model: default
        timeout_secs: 300
      op-harness-agy:
        provider: harness-agy
        model: default
        timeout_secs: 300
      op-harness-pi:
        provider: harness-pi
        model: default
        timeout_secs: 300
      # Size variants — background ops want SMALL models, and CLI
      # defaults are the flagship tier. The profile's `model` rides the
      # CLI's model flag (claude/agy/pi --model, codex/grok -m).
      # Names are owner-editable — check the
      # CLI's own list (`claude --help` aliases, `agy models`) for current
      # ids. `op-harness-*` above left at the CLI default for comparison.
      op-harness-claude-small:
        provider: harness-claude_code
        model: haiku
        timeout_secs: 300
      op-harness-grok-small:
        provider: harness-grok
        model: grok-4-fast
        timeout_secs: 300
      op-harness-agy-small:
        provider: harness-agy
        model: gemini-3.7-flash-low
        timeout_secs: 300
      op-harness-claude-sonnet:
        provider: harness-claude_code
        model: sonnet
        timeout_secs: 300
      op-harness-claude-opus:
        provider: harness-claude_code
        model: opus
        timeout_secs: 300
      op-harness-claude-fable:
        provider: harness-claude_code
        model: fable
        timeout_secs: 300

      op-harness-grok-4:
