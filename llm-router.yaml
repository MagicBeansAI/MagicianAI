        metadata:
          openai_api_mode: responses
          tool_choice:
            type: none
          verbosity: low

      chat-gptterra-responses-toolsauto-rnone:
        provider: openai
        model: gpt-5.6-terra
        api_key_env: OPENAI_API_KEY
        supports_tool_calling: true
        max_output_tokens: 32768
        timeout_secs: 600
        metadata:
          openai_api_mode: responses
          tool_choice: auto

      # Fast variant of the default chat profile — same model + vision +
      # tool support, but reasoning is turned off and the output budget is
      # tightened. Used as the `fast_profile` of `chat-openai-adaptive`
      # below: chat starts here, escalates to the thinking variant via
      # `request_thinking_mode` only when the LLM decides extended
      # reasoning is warranted.
      #
      # NOTE on `max_output_tokens: 4096`: chat-perceived latency is
      # dominated by visible-token streaming at ~50–60 tok/s on
      # gpt-5.x. The original 32K cap rarely bound the model but
      # also gave it no incentive to be concise, so typical chat
      # replies ran 1,200–1,800 tokens (~22–30s of streaming). The
      # 4K cap bounds tail latency and pairs with the v0.0.3 chat
      # outer-loop system prompt's "Response shape" guidance, which
      # nudges the model toward ~3–5 sentence replies unless the
      # user signals they want depth. Scope is chat-only — agentic
      # / memory / mining flows use their own profiles with their
      # own (higher) caps because their outputs feed downstream
      # turns and can't be truncated safely.
      chat-gptterra-responses-vision-toolsauto-fast:
        provider: openai
        model: gpt-5.6-terra
        api_key_env: OPENAI_API_KEY
        supports_vision: true
        supports_tool_calling: true
        supports_reasoning: false
        max_output_tokens: 4096
        timeout_secs: 600
        metadata:
          openai_api_mode: responses
          tool_choice: auto
          streaming: true

      # Thinking variant — same model with high reasoning effort and a
      # generous output budget. Used as the `thinking_profile` of
      # `chat-openai-adaptive`. The chat runtime swaps to this profile
      # when the LLM emits `request_thinking_mode` from the fast variant.
      #
      # NOTE on reasoning token caps: OpenAI's Responses API does NOT
      # accept `reasoning.max_tokens` (it 400s as `Unknown parameter`).
      # The total budget is bounded by top-level `max_output_tokens`,
      # which is shared between visible output and reasoning tokens.
      # Reasoning intensity is controlled qualitatively via `effort`.
      # `summary: auto` enables the API's reasoning-summary stream so
      # the UI can render "Thought" rows.
      #
      # NOTE on `max_output_tokens: 8192`: chat-mode thinking turns
      # typically need 800–1,200 visible output tokens + 900–1,100
      # reasoning tokens (~2,000–2,300 total). The original 64K cap
      # was a no-op ceiling; 8K bounds tail latency and pairs with
      # the v0.0.3 chat outer-loop system prompt that biases toward
      # concise replies. Reasoning effort stays `high` because the
      # whole point of escalating to this profile is that the user's
      # request needed deeper thinking. Scope is chat-only.
      chat-gptterra-responses-vision-toolsauto-thinking:
        provider: openai
        model: gpt-5.6-terra
        api_key_env: OPENAI_API_KEY
        supports_vision: true
        supports_tool_calling: true
        supports_reasoning: true
        max_output_tokens: 8192
        timeout_secs: 600
        reasoning:
          effort: high
          summary: auto
        metadata:
          openai_api_mode: responses
          tool_choice: auto
          streaming: true

      # GPT-5.6 Sol chat pair — the frontier OpenAI tier. Advanced chat starts
      # with reasoning disabled on Sol and can explicitly escalate the same
      # turn to Sol with high reasoning, avoiding a model-family switch while
      # preserving the adaptive fast/thinking contract.
      chat-gptsol-responses-vision-toolsauto-fast:
        provider: openai
        model: gpt-5.6-sol
        api_key_env: OPENAI_API_KEY
        supports_vision: true
