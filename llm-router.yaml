        default: op-channel-distill-local
        when_cloud: op-channel-distill-remote
        description: "Distills an incoming channel message into durable context."
        group: "Channels"
      # Mail Assist Phase-2 classifier. BODY-BLIND (reads only the local
      # summaries, never raw bodies), so it may run local OR remote — kept on
      # the local gemma profile here for privacy; swap to a capable remote
      # (e.g. gpt61sol-responses-toolsany) for sharper triage if wanted.
      channel_classify:
        default: op-channel-classify-local
        when_cloud: op-channel-classify-remote
        description: "Classifies incoming channel messages for routing and attention."
        group: "Channels"
      # Mail Assist Phase-2 reply drafter. LOCAL-PINNED (sees the raw latest
      # message), same fail-closed policy as channel_ingest_distill: the drafter
      # refuses any non-Ollama binding, and unbound => draft unavailable.
      channel_reply_draft:
        default: op-channel-reply-draft-local
        when_cloud: op-channel-reply-draft-remote-gpt61sol
        description: "Drafts an assisted reply for a channel conversation."
        group: "Channels"
      # Passive metadata/summary-only recurrence learning. This operation is
      # body-blind and writes generic timing/topic patterns to user memory.
      channel_pattern_synthesis:
        default: op-channel-classify-local
        when_cloud: op-channel-classify-remote
        description: "Synthesizes recurring patterns across channel activity."
        group: "Channels"
      # Proactive semantic resurfacing curator. Reads bounded safe briefs and
      # signal profiles (never raw bodies), picks the few durable items most
      # worth resurfacing, and authors a one-line surface + "why now". Bound to
      # local Gemma; unbound/failure uses the conservative deterministic path.
      resurfacing_curate:
        default: op-ambient-distill-local
        when_cloud: op-ambient-distill-remote
        description: "Curates which remembered items should resurface now."
        group: "Attention"
      # Explicit owner-triggered deeper summary of the exact live source.
      # Privacy lock: code refuses any non-Ollama binding and pins dispatch to
      # this verified local profile with fallback disabled.
      resurfacing_deep_summary:
        default: op-channel-distill-local
        when_cloud: op-channel-distill-remote
        description: "Produces a deeper summary for resurfaced context."
        group: "Attention"
      # Work-evidence graph: screen/session and tier-backed distillation are
      # memory-quality promotion jobs, not generic default-profile work.
      screen_evidence_distill:
        default: op-memory-evidence-distillation-fast
        description: "Distills captured screen evidence into compact findings."
        group: "Vision"
      tier_evidence_distill:
        default: op-memory-evidence-distillation-fast
        description: "Distills evidence while moving memory between tiers."
        group: "Evidence"
      # Live Thinking Map interpreter: finalized utterance → bounded, model-safe
      # {"operations":[...]} JSON. Isolated on its own OpenAI GPT-6 Luna
      # profile (NOT a shared memory/chat profile) so tuning stays independent.
      thinking_map_interpret:
        default: op-thinking-map-interpret
        description: "Turns a Thinking Map utterance into bounded map operations."
        group: "Planning & execution"
      # Agentic ledger compactor (compaction Phase B): itemized live-window →
      # strict {"patches":[...],"rationale"} JSON, validated + enforced in
      # Rust. Bound to the cheap local think-off profile; DORMANT until the
      # Phase C executor trigger wires it (nothing dispatches this op today).
      # Unbound would read as router_unavailable → deterministic-eviction
      # fallback, never default_profile.
      agentic_ledger_compaction:
        default: op-agentic-ledger-compaction-local
        when_cloud: op-agentic-ledger-compaction-remote
        description: "Compacts the live execution ledger while preserving actionable state."
        group: "Planning & execution"
      # Work-evidence graph eval helpers stay on the bounded Terra profile, but are
      # explicit so they do not silently inherit future default-profile changes.
      evidence_claims:
        default: gpt6luna-responses-toolsany
        description: "Extracts evidence-backed claims from source material."
        group: "Evidence"
      evidence_precision_judge:
        default: gpt61sol-responses-toolsany
        description: "Judges whether evidence precisely supports each claim."
        group: "Evidence"
      # Work-evidence graph read path: synthesize an impact review from accrued
      # evidence over a caller-chosen window (no fixed weekly cadence). Output /
      # synthesis op — a bounded Terra model, no tools, larger output budget.
      evidence_review:
        default: gpt6luna-responses-toolsnone-out16k
        description: "Reviews evidence coverage, quality, and conflicts."
        group: "Evidence"
      # Work-evidence graph verification gate: grounding critic that flags review
      # claims unsupported by the evidence packet. A focused judging task — use
      # the bounded Terra evidence profile; deterministic citation checks still
      # guard verifier failures.
      evidence_review_verify:
        default: op-memory-evidence-distillation-fast
        description: "Performs a fast verification pass on distilled evidence."
        group: "Evidence"
      memory_user_promotion:
        default: op-memory-user-promotion-standard
        description: "Promotes durable insights into user-level memory."
        group: "Memory"
      memory_episode_quality_classification:
        default: op-memory-episode-quality-local-chunked
        when_cloud: op-memory-episode-quality-remote
        description: "Classifies whether an episode contains useful extractable memory."
        group: "Memory"
      memory_temperature_utility_review:
        default: op-memory-utility-review-local-chunked
        when_cloud: op-memory-utility-review-remote
        description: "Reviews memory utility and recommends temperature or retention changes."
        group: "Memory"
      memory_conflict_review:
        default: op-memory-conflict-review-standard
        description: "Resolves conflicting memory items."
        group: "Memory"
      memory_conflict_review_high_risk:
        default: op-memory-conflict-review-high-risk
        description: "Resolves sensitive user or global memory conflicts."
        group: "Memory"
      learning_reflection:
        default: op-learning-reflection-standard
        description: "Reflects on outcomes to identify reusable learning."
        group: "Learning"

