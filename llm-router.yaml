      # MiniMax M3 agentic-decision profile. AVAILABLE but NOT currently bound:
      # `agentic_decision` uses `gpt61sol-responses-vision-toolsany-rhigh-out64k`
      # (GPT-5.6 Terra, reasoning=high). M3 was validated end-to-end on the browser loop
      # (vision + tool-results + thinking all work) but under-drove the task
      # (inspect-don't-act → premature yield), so the proven GPT-5.6 Terra decider stays.
      # Swap this profile into operation_mapping.agentic_decision to drive the loop
      # with M3. M3 is natively multimodal (image + reasoning + tools in one request
      # on MiniMax's OpenAI-compatible /v1/chat/completions endpoint) and handles
      # text-only turns too, so one profile covers both.
      #
      # tool_choice: auto because MiniMax only accepts `auto` | `none` (never
      # `any`/`required`).
      #
      # reasoning.effort: M3's thinking is a BINARY native switch
      # (`thinking: {type: enabled|disabled}`) — it has NO high/medium/low intensity
      # dial (the OpenAI-style `reasoning_effort` is a no-op on M3). The provider
      # collapses `effort` to on/off: any non-`none` value (here `high`) enables
      # thinking; `none`/`off` disables it. So `high` (and the `rhigh` in the name)
      # means "think before deciding", NOT a tunable depth — when enabled, M3 reasons
      # adaptively per turn. Without this the decider ran shallow and emitted zero
      # reasoning on some turns (the lazy inspect-don't-act failure).
      # xAI Grok 4.7 over the xAI Responses API (`provider: xai`,
      # https://api.x.ai/v1/responses). Server continuation
      # (`previous_response_id`) is the default reuse strategy and every
      # request carries the execution-scoped `prompt_cache_key` — xAI caches
      # per server, measured at ~75–80 % cached input on continued turns.
      # Reasoning cannot be disabled (xAI refuses `effort: none`), so the
      # "fast" chat half runs at `low` effort. $2 / $0.50 cached / $6 per 1M,
      # doubled for prompts that reach 200k. Key: XAI_API_KEY.
