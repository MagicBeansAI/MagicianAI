        background_context_32768: {output_tokens: 8192, timeout_secs: 300, thinking: low, answer_reserve_tokens: 1024, context_window_tokens: 32768}
        # Chat that touches remote-allowed app data runs on workload/app_processing/chat_cloud with
        # this larger window: the chat prompt plus tools needs about 90K, more than the 32K window.
        # App WORKFLOWS stay on workload/app_processing/cloud (32K): a workflow reserves its whole
        # window on every LLM call against a per-run input ceiling that is cumulative, so widening
        # the shared workflow profile shrinks every app's usable call budget. Local-only data stays
        # on the 32K local route.
        background_context_131072: {output_tokens: 8192, timeout_secs: 300, thinking: low, answer_reserve_tokens: 1024, context_window_tokens: 131072}
