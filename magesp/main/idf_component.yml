dependencies:
  idf: ">=5.5"
  # Overridden to a LOCAL, PATCHED copy -- see magesp/README.md.
  # Upstream treats a rejected FT5x06 tuning register as a fatal error and the
  # caller then deletes the whole touch device, so this board (an FT3168 that
  # speaks the FT5x06 data registers but NAKs some tuning addresses) booted
  # display-only and every tap on every screen went nowhere.
  # managed_components/ is gitignored, so patching it there would not survive.
  # Realtime step 1 only. Nothing on the working turn path uses this.
  espressif/esp_websocket_client: "^1.5"
  espressif/esp_lcd_touch_ft5x06:
    version: "^1.1.0"
    override_path: "../components/esp_lcd_touch_ft5x06"
  waveshare/qmi8658:
    version: "^2.0.0"
    public: true
