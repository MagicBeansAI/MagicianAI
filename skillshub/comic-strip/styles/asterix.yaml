name: Asterix-ish
prompt_fragment: |
  French bande dessinée in the bouncy expressive Goscinny/Uderzo tradition.
  Exaggerated cartoon caricatures with rubber-hose limbs, big noses, wild
  expressions. Black ink outlines varying thickness 1-3px (thicker on
  characters, thinner on backgrounds). Flat color fills with occasional
  bold drop shadows. Color palette is warm and rural: ochre, leaf green,
  terracotta, wine red, sky blue. Compositions are crowded with comedic
  detail — small running gags, signs in the background, characters
  reacting in the periphery. Speech bubbles white with thin black
  borders. Mood is comedic, brisk, slapstick. Sound-effect text rendered
  as part of the art ("PAF!", "BOING!", "SPLASH!").
ip_safe_note: |
  Inspired by Asterix/Lucky Luke style, NOT the trademark characters.
  Create original characters in similar visual language.
