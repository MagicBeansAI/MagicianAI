name: Calvin-and-Hobbes-ish
prompt_fragment: |
  Newspaper-strip style with pen-and-ink linework and watercolor washes.
  Expressive variable-weight black inks (1-4px) — confident, sketchy,
  loose. Watercolor fills are translucent with visible brush strokes and
  wet edges. Color palette is autumn and earth tones: leaf brown,
  mustard yellow, soft red, washed-out blue, white. Character design
  is rubber-limbed and expressive — wide range of emotion from quiet
  contemplation to manic glee to slapstick chaos. Backgrounds shift
  between detailed (suburban yards, forests, snowy hills) and minimal
  (just two characters in conversation). Mood ranges from whimsical
  to philosophical. Speech bubbles white with hand-lettered feel.
ip_safe_note: |
  Inspired by Bill Watterson's Calvin and Hobbes style, NOT the
  trademark Calvin or Hobbes characters. Create original characters
  in similar visual language — imaginative kid + loyal companion
  archetypes are fine if generic.
