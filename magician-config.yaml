# MagicianV2 Configuration
# LLM configurations for multi-step workflows

consumer_mode: true

runtime:
  scale:
    # PR8 pre-bootstrap plan. `null` inherits the selected profile.
    # Seed stays `current`. `MAGICIAN_SCALE_PROFILE` overrides the name
    # (restart-bound). Mixing leftover `llm.dispatch.workers: 3` or `12`
    # with an explicit non-current profile is a boot error.
    profile: current
    overrides:
      main_worker_threads: null
      http_worker_threads: null
      execution_worker_threads: null
      background_worker_threads: null
      lance_worker_threads: null
      lance_search_cost_units: null
      blocking_admission_permits: null
      live_agent_limit: null
      workers: null
      reserved_interactive_workers: null
      global_cloud_concurrency: null
      queue_capacity_high: null
      queue_capacity_normal: null
      queue_capacity_background: null
  retrieval:
    result_cache:
      # Default on. Kill switch MAGICIAN_MEMORY_HYBRID_RESULT_CACHE=off.
      enabled: true
      max_entries: 512
      max_bytes: 67108864
    lance_table_pool:
      # Cross-request reuse of Lance search tables. Kill switch:
      # MAGICIAN_LANCE_TABLE_POOL=off.
      enabled: true
      max_idle: 4
    query_vector_cache:
      # Exact-query embedding LRU. Default on. Kill switch:
      # MAGICIAN_QUERY_VECTOR_CACHE=off.
      enabled: true
      max_entries: 1024
      max_bytes: 33554432
    vector_search: ann # flat | ann_shadow | ann
    ann:
      min_rows: 256
      candidate_multiplier: 4
  ollama:
    # Request-level model residency window for local Ollama calls. Env override:
    # MAGICIAN_OLLAMA_KEEP_ALIVE.
    keep_alive: 10m
    # Generation models and contexts are resolved from Ollama profiles named by
    # llm.router.operation_mapping. Embeddings run on a dedicated daemon so a
    # generation request can never occupy the embedding request queue.
    max_loaded_models: 2
    embedding_base_url: http://127.0.0.1:11435
    # Which local generation model gets installed and run, decided by how much
    # memory the machine has. The installer picks the first tier the machine
    # satisfies and writes it to `selected`; every Ollama generation profile in
    # llm.router.profiles reads `selected` through the anchor below, so the
    # installer, the runtime and magician-components/src/graph.yaml cannot
    # disagree about which model is actually resident.
    #
    # Below `min_memory_gb`, or off the stated arch/os, no generation model is
    # installed at all: chat runs on a remote provider and "keep processing on
    # this machine" is simply unavailable. This mirrors the `host:` block on the
    # ollama-generation component in magician-components/src/graph.yaml — change
    # both or neither.
    local_generation:
      min_memory_gb: 16
      requires_arch: arm64
      requires_os: macos
      # First tier whose min_memory_gb the machine meets wins, so these stay in
      # descending order. The embedder is resident alongside whichever is
      # chosen, which is why the bar is higher than the model alone would need.
      # `resident_gb` is roughly what the model holds once loaded. It is only
      # used to warn when a machine is tight at install time — not a limit, and
      # Ollama will still try and then swap.
      tiers:
        - min_memory_gb: 36
          model: qwen3.8-ud2-mtp
          resident_gb: 11
        - min_memory_gb: 24
          model: gemma4:12b
          resident_gb: 8
        - min_memory_gb: 16
          model: woof-4b
          resident_gb: 3
      # The other two claims on memory while Magician runs: the embedder, which
      # is always resident, and what the OS and the rest of the stack need to
      # not be miserable.
      embedding_resident_gb: 4
      system_headroom_gb: 6
      # Seed default is Gemma 4. make setup-ollama overwrites this from the
      # memory tier (36+ Qwen, 24–35 Gemma, 16–23 Woof). Override with
      # make setup-local-generation MODEL=<id> SELECT=1
      # Kitty scores: data/magician_v2/local_generation_catalog.yaml
      selected: &local_generation_model gemma4:12b
    embedding_keep_alive: "-1"
    # Conservative physical admission capacity. The current Ollama embedding
    # runner is single-sequence; foreground reads preempt background batches.
    embedding_num_parallel: 1
    embedding_max_loaded_models: 1
    embedding_query_timeout_ms: 5000
    # Distinct-query micro-batch. Window 3ms / max items 8. A lone chat miss
    # still flushes immediately. Kill switch: MAGICIAN_EMBEDDING_QUERY_BATCH=off.
    embedding_query_batch_window_ms: 3
    embedding_query_batch_max_items: 8
    embedding_query_batch_max_chars: 6000
    embedding_write_timeout_ms: 180000
    embedding_context_tokens: 8192
    embedding_batch_tokens: 512
    # Items per physical embedding request.
    #
    # Raised 2 -> 10 on 2026-09-07 and MEASURED, not assumed. A full rebuild of
    # 36,988 chunks went 4.90 -> 5.62 chunks/s: 5x the batch bought 15%.
    # Per-request time scaled almost linearly with payload (408 -> 1,781 ms for
    # 252 -> 1,260 tokens), i.e. token throughput moved 618 -> 708 tok/s and
    # then stopped. That is a saturated GPU, not per-request overhead.
    #
    # So width is NOT the lever here and raising it further will not help; the
    # ceiling is the 4B embedding model itself. Keep 10 because the 15% is free,
    # but treat any further speed work as a decision about the model (size or
    # quantization), which also changes retrieval quality and forces another
    # full re-embed.
    #
    # The ceiling is DEFAULT_OLLAMA_MAX_BATCH_CHARS (6,000) in
    # memory_index.rs, overridable only by
    # MAGICIAN_MEMORY_EMBEDDING_MAX_BATCH_CHARS — NOT by
    # embedding_query_batch_max_chars above, which governs the foreground
    # query micro-batch and merely happens to share the value.
    # `embedding_batch_tokens` is applied as a BYTE cap per input (512 minus an
    # 8-token reserve = 504 B, ~126 tokens), so 10 x 504 B stays inside 6,000
    # and the item count, not the char ceiling, stays the binding limit.
    #
    # One width serves EmbeddingPriority::{Read, BackgroundRead, Write}, but it
    # only binds when a call has many inputs: a single foreground query still
    # embeds at width 1, and the query micro-batch is separately capped at 8
    # items.
    embedding_batch_size: 10
    embedding_model: hf.co/mykor/pplx-embed-v1-4b-GGUF:Q6_K
    embedding_dimensions: 2560
    kv_cache_type: q8_0
    flash_attention: true
    # Generation prewarm policy. Embedding is always prewarmed and pinned.
    prewarm: true
    replace_existing_local_daemon: true

# Workspace storage backend selector (local_file | silverbullet_space). Folded in
# from the former workspace_storage/settings.json; the settings API reads + mutates
# this section in place. Typed storage profiles are a separate bootstrap file
# (`--storage-bootstrap` / MAGICIAN_STORAGE_BOOTSTRAP_CONFIG). When that file is
# absent, this local selector is unchanged.
# Automatic, lossless maintenance of Channel Assist and Feed DuckDB stores.
# Heavy work runs after HTTP startup; only the affected database is gated.
database_maintenance:
  enabled: true
  startup_delay_seconds: 15
  check_interval_seconds: 1800
  cooldown_seconds: 86400
  max_deferral_seconds: 21600
  min_database_mib: 64
  fragmented_row_groups: 128
  channel_memory_mib: 1024
  feed_memory_mib: 256
  maintenance_memory_mib: 2048

workspace_storage:
  provider: silverbullet_space

# Public HTTPS origin placed into short-lived mobile enrollment QR codes, and
# used to build the "Open secure request" link in a critical-request alert
# (`{origin}/attention?attention=1&attention_item=<id>`). Without it the alert
# still goes out and simply tells the owner where to look instead. The link
# carries no authority: it opens behind login and scope, so a forwarded URL
# grants nothing and a link-preview fetch cannot claim or resolve a request.
# The Cloudflare provisioning script normally supplies the machine-local env
# override, so this seed stays customer-neutral.
mobile_access:
  public_origin: null
  # A private / self-hosted Magdroid build needs no pins here: the owner
  # approves the exact build (signer, version) the phone's hardware attestation
  # proves at the first pairing, and the device stays pinned to it. Fill the
  # signer and version to name the build explicitly instead. A Play build needs
  # them plus the server-decoded Play Integrity policy below.
  android_apps_signing_sha256: []
  # Google-published hardware-attestation roots. Refresh from
  # https://android.googleapis.com/attestation/root when Google rotates them.
  android_attestation_root_sha256:
    - cedb1cb6dc896ae5ec797348bce9286753c2b38ee71ce0fbe34a9a1248800dfc
    - 6d9db4ce6c5c0b293166d08986e05774a8776ceb525d9e4329520de12ba4bcc0
  # Diagnostic only; this app-reported checksum is not an authority proof.
  android_apps_apk_sha256: []
  # Exact reviewed versions accepted for both Play and private/self-hosted builds.
  android_apps_version_codes: []
  android_play_integrity_cloud_project_number: null
  android_play_integrity_version_codes: []
  android_play_integrity_required_device_verdicts: []

analytics:
  llm_trace:
    enabled: true
    # Safe runtime default: content-free facts only. Enable sanitized capture
    # through an exact scope/operation override after redaction audit.
    content_mode: metadata
    metadata_capture_rate: 1.0
    sanitized_content_rate: 1.0
    payload_records: 512
    retention:
      facts_days: 90
      context_metadata_days: 90
      sanitized_io_days: 30
      encrypted_raw_days: 7
    redaction:
      policy_version: llm-content-redaction-v1
      fail_to_metadata_only: true
      max_payload_bytes: 524288
      max_block_chars: 65536
    training_default_eligible: false
    exclude_public_guest_content: true
    operation_overrides: {}
    scope_overrides: {}

coding:
  default_profile: coding-balanced
  # Lead engineer that drives VibeDev coding runs (tasks tagged `vibedev`). Swapping the
  # coding lead (e.g. EM -> CTO) is a one-line edit here, not a UI/code change.
  # 2026-06-19 (plan §10/§10.1): EM "Bridge" collapsed into CTO "Forge"; CTO is now the
  # engineering authority and delegates directly to the coding ICs.
  lead_agent_id: cto
  # contribute_to_project write mode: true = write straight into the project repo (autonomous,
  # the contributing agent already curated the artifact); false = stage behind diff-approval HITL.
  contribute_direct: true
  # Duration is NOT what decides whether a coding run should stop.
  #
  # A run that has been going six hours while committing every two minutes is
  # healthy; a run that has been silent for twenty is not, however long it has
  # been alive. So liveness (`no_progress`) is the primary bound, the cost
  # ceiling (`MAGICIAN_AGENTIC_MAX_COST_USD` + the token meter) is the real
  # spend limit, and the wall clock below is only a backstop that catches a bug
  # in one of those. A long autonomous run is supposed to be possible.
  #
  # Renamed from `timeout_secs`, which is still accepted; setting BOTH to
  # different values is rejected rather than silently resolved. Raising the old
  # key alone used to change nothing: the agentic executor independently clipped
  # every coding run to a generic 40-minute ceiling, so one budget moved and the
  # other did not. Both now read this block.
  #
  # 0 = no wall clock at all, leaving liveness and cost as the only stops.
  turn_timeout_secs: 28800
  # Optional ACTIVE-time ceiling for the whole coding task (waiting on diff
  # approval is not spending; parallel children do not double-charge wall
  # clock). 0 = none, which is the default: active time is still accumulated and
  # reported, it just never stops work. Set a positive value only if you want a
  # hard cap per task.
  task_budget_secs: 0
  # Held back from task_budget_secs so verification and repair are not starved
  # by the coding phase. Inert while task_budget_secs is 0 — with no ceiling
  # there is nothing to be starved of.
  verification_reserve_secs: 1200
  # Liveness. THIS is what stops a wedged run. Each phase carries its own bound
  # because they fail differently: a 16-minute test is silent by nature, a
  # compaction emits nothing at all, and an auto-retry announces its own
  # backoff. A single idle timer across all of them either kills healthy work or
  # never fires.
  no_progress:
    enabled: true
    # No text or thinking delta from the model.
    model_idle_secs: 900
    # No output from a running tool. Deliberately longer than the model's: a
    # single test command here legitimately runs 16 minutes saying nothing.
    tool_idle_secs: 1500
    # A tool that runs forever while STAYING chatty, which an inactivity bound
    # alone can never catch.
    tool_max_secs: 3000
    compaction_max_secs: 900
    summarization_max_secs: 900
    # Added to a retry's own declared backoff, never used in place of it.
    retry_grace_secs: 120
  persist_session: false
  # Local `codex app-server` discovery. Selectable only after Ready
  # qualification. The browser/model/tool cannot set `binary`.
  codex:
    enabled: true
    # binary: /opt/homebrew/bin/codex
  # Local `grok agent stdio` discovery. Selectable only after Ready
  # qualification (version + auth + positive isolation evidence). The
  # browser/model/tool cannot set `binary`.
  grok:
    enabled: true
    # binary: ~/.grok/bin/grok
  # Local `claude -p --output-format stream-json` discovery. Selectable when
  # enabled and exactly one reviewed binary is found, the CLI meets the
  # frozen minimum, Max/OAuth is signed in, and isolation is attested.
  # Default `use_api_key: false` so the child does not inherit Magician's
  # ANTHROPIC_API_KEY (Max subscription / OAuth). The browser/model/tool
  # cannot set `binary`.
  claude:
    enabled: true
    use_api_key: false
    # binary: /opt/homebrew/bin/claude
  # Local `agy -p --output-format stream-json` discovery. Selectable when
  # enabled and exactly one reviewed binary is found, the CLI meets the
  # frozen minimum, Antigravity OAuth is signed in, and isolation is
  # attested. Default `use_api_key: false` so Magician's GEMINI_API_KEY
  # is not inherited. The browser/model/tool cannot set `binary`.
  agy:
    enabled: true
    use_api_key: false
    # binary: ~/.local/bin/agy
  profiles:
    - id: coding-balanced
      label: GPT-6.1 Sol coding · 64k output
      llm_profile: gpt61sol-responses-vision-toolsany-rhigh-out64k
      description: Default Pi-backed implementation profile for routine engineering work.

    - id: coding-premium
      label: GPT-6.1 Sol coding
      llm_profile: gpt61sol-responses-vision-toolsany-rhigh
      description: Premium vision-capable profile for the hardest implementation and review work.

    - id: coding-astra
      label: GPT-6 Astra coding
      llm_profile: gptastra-responses-vision-toolsany-rhigh
      description: Frontier vision-capable profile for the hardest end-to-end implementation and review work.

    - id: coding-opus5
      label: Claude Opus 5 coding
      llm_profile: opus5-messages-vision-toolsauto-rhigh-think8k
      description: Retained previous-generation Anthropic vision-capable profile for compatibility and rollback.

    - id: coding-opus55
      label: Claude Opus 5.5 coding
      llm_profile: opus55-messages-vision-toolsauto-rhigh-think8k
      description: Latest Anthropic advanced vision-capable profile for long-running agentic coding and review.

    - id: coding-fable
      label: Claude Fable 5.1 coding
      llm_profile: fable51-messages-vision-toolsauto-rhigh
      description: Anthropic frontier vision-capable profile. tool_choice is auto; Fable 5.1 rejects forced tool use.

    - id: coding-luna
      label: GPT-6 Luna coding
      llm_profile: gpt6luna-responses-vision-toolsany-rnone-out16k
      description: Fast, lower-cost vision-capable profile for bounded edits and routine iteration.

    - id: coding-grok47
      label: Grok 4.7 coding
      llm_profile: grok47-responses-vision-toolsany-rhigh
      description: xAI Grok 4.7 vision-capable profile with high reasoning; needs XAI_API_KEY. Pi runs it on the Responses API.

    - id: coding-deepseek-v4.1-flash
      label: DeepSeek V4.1 Flash coding
      llm_profile: dsv4-flash-vision-messages-toolsany-rhigh
      description: Vision + thinking DeepSeek V4.1 Flash profile for code work including screenshots. Replaces retired V4 Pro / V4 Flash / Flash Vision catalogue entries.

    - id: coding-minimax-m3
      label: MiniMax M3 coding
      llm_profile: m3-vision-toolsauto-rhigh-out64k
      description: Multimodal MiniMax profile for code work that also needs screenshots or visual context.

verification:
  # The verification controller: holds a coding candidate's success until the
  # project's required checks pass. disabled | observe | enforce.
  #
  # observe opens gates and RUNS the checks — recording real attestation
  # evidence — but never holds completion, never dispatches repair. It is the
  # qualification mode before enforce. The MAGICIAN_VERIFICATION_CONTROLLER
  # env var, when set, overrides this mode (process-local kill switch); a typo
  # in either place degrades to disabled, never to enforce.
  mode: observe
  # Repair rounds before a gate settles `exhausted`. 0 is legitimate: verify
  # once, never repair.
  max_repair_rounds: 3
  # Wall clock across the gate's WHOLE lifecycle, idle waits included — this
  # is what settles a repair whose engineer never comes back.
  max_elapsed_secs: 7200
  # USD ceiling across a gate's repair rounds, fed by the engine-reported
  # session cost of each round. Unset = no spend ceiling.
  # max_spend_usd: 5.0
  # How often the reconciler re-offers retryable gates a pass. 0 disables
  # periodic driving (startup recovery only — the pre-reconciler behaviour).
  reconcile_interval_secs: 60
  # Owner baseline policy: checks every gated repository must run, which a
  # repository's own .magician/verification.{json,yaml} may add to but never
  # remove or swap. Absent = each repository defines its own verification; a
  # repository with no policy file then completes as `unverified`.
  # baseline:
  #   required:
  #     - id: check
  #       program: make
  #       args: ["check-all"]
  #       display: make check-all

vibedev_deploy:
  # First-slice static publishing. The enabled target requires Cloudflare
  # Pages credentials in the Magician process environment.
  enabled: true
  build_timeout_secs: 300
  publish_timeout_secs: 300
  max_artifact_bytes: 104857600
  max_artifact_files: 10000
  output_dirs:
    - dist
    - build
    - out
    - .svelte-kit/output/prerendered/pages
  targets:
    - id: cloudflare-pages
      label: Cloudflare Pages
      provider: cloudflare-pages
      kind: static
      enabled: true
      default: true
      command:
        program: scripts/vibedev-cloudflare-pages-deploy.sh
        args:
          - --output-dir
          - "{output_dir}"
          - --project-name
          - "{site_slug}"
          - --branch
          - main
        public_url_regex: "VIBEDEV_PUBLIC_URL=(https://[^\\s]+)"
        env_allowlist:
          - CLOUDFLARE_PAGES_API_TOKEN
          - CLOUDFLARE_API_TOKEN
          - CLOUDFLARE_ACCOUNT_ID
          - WRANGLER_BIN

memory:
  prompt_snapshot:
    enabled: true
    max_bytes: 67108864
    max_entries: 8
    idle_ttl_secs: 600
    refresh_debounce_ms: 100
  prompt_scope_budgets:
    user: { max_entries: 24, max_chars: 12000 }
    agent: { max_entries: 24, max_chars: 12000 }
    agent_goal: { max_entries: 24, max_chars: 16000 }
  prompt_lane_budgets:
    user:
      # Slice 3: 4/1600 -> 6/2400. The old ceiling was set when selection was
      # pure cosine and extra entries were mostly noise; with scope-tag
      # narrowing ahead of the judge, more entries survive that actually
      # govern the task, so the budget is worth spending.
      user_preference: { max_entries: 6, max_chars: 2400 }
      procedure: { max_entries: 2, max_chars: 800 }
      entity: { max_entries: 2, max_chars: 720 }
      project_context: { max_entries: 1, max_chars: 400 }
      environment: { max_entries: 1, max_chars: 320 }
      agent_context: { max_entries: 1, max_chars: 256 }
      episode: { max_entries: 0, max_chars: 0 }
      source_evidence: { max_entries: 0, max_chars: 0 }
    agent:
      procedure: { max_entries: 2, max_chars: 880 }
      project_context: { max_entries: 2, max_chars: 800 }
      entity: { max_entries: 2, max_chars: 720 }
      environment: { max_entries: 2, max_chars: 560 }
      agent_context: { max_entries: 2, max_chars: 880 }
      episode: { max_entries: 1, max_chars: 320 }
      source_evidence: { max_entries: 0, max_chars: 0 }
      user_preference: { max_entries: 0, max_chars: 0 }
    agent_goal:
      project_context: { max_entries: 4, max_chars: 2520 }
      procedure: { max_entries: 2, max_chars: 1080 }
      entity: { max_entries: 2, max_chars: 840 }
      episode: { max_entries: 1, max_chars: 480 }
      environment: { max_entries: 1, max_chars: 480 }
      agent_context: { max_entries: 1, max_chars: 480 }
      source_evidence: { max_entries: 0, max_chars: 0 }
      # Slice 3: 0/0 -> 2/800. Goal-scoped work could previously see no user
      # preferences at all, which is the lane most likely to carry "how this
      # kind of work should be done". `agent` deliberately stays 0/0 — an
      # agent's own scope is not where owner taste belongs.
      user_preference: { max_entries: 2, max_chars: 800 }
  # ACTIVE taste_profile block. Note the caveat below: `memory` rejects unknown
  # keys, so this block makes the config unparseable by a binary older than
  # 0.6.1196. That is acceptable here because the runtime and this file ship
  # together; if you share this file with an older deployment, comment it out.
  taste_profile:
    enabled: true
    note_path: profile.md
    max_chars: 4000
    # Capture ON. Distillation still requires the operation binding below —
    # this flag alone changes nothing.
    capture_enabled: true
    max_proposals_per_day: 5
    min_confidence: 0.6

  # taste_profile — owner-edited taste note loaded through the Notes provider
  # and snapshotted for prompt injection. Deliberately left commented out: the
  # `memory` block rejects unknown keys, so an active block here would fail to
  # parse under an older binary sharing this file. Defaults live in code
  # (`magician/src/magician_v2/taste_profile.rs`):
  #   enabled: true
  #   note_path: profile.md   # provider-relative, under the notes root
  #   max_chars: 4000         # over-ceiling flag only; content is never truncated
  # The note is injected as read — nothing in it is filtered — so proposals
  # awaiting approval must live in a different note. That path derives from
  # note_path (profile.md -> profile.inbox.md) and may be set explicitly; it
  # is refused if it resolves to note_path itself:
  #   proposals_note_path: profile.inbox.md
  # Capture (Slice 2) distils finished sessions into proposals. It defaults to
  # OFF, unlike injection: injection reads one note the owner wrote on purpose,
  # capture reads their transcripts. Enabling it is not enough on its own — the
  # distiller model binds under llm.router.operation_mapping as
  # `taste_profile_distill`, and an unbound operation means capture stays off
  # rather than falling back to the router default. Any provider may be bound:
  # the transcript already went to whichever model conducted the session, so
  # forcing a local distiller would protect nothing. Binding a DIFFERENT vendor
  # than your chat model is a new disclosure — choose it knowingly:
  #   capture_enabled: false
  #   max_proposals_per_day: 5   # against approval fatigue; must be >= 1 when on
  #   min_confidence: 0.6        # candidates below this are never filed

