  # Preference alignment (docs/components/magician/preference-alignment.md):
  # whether a proposed outward or commitment act fits the owner's intentions.
  # Pack 1.3.0 asks once per offered intention (one item each), with the
  # owner's other offered statements in context when more than one is
  # offered; the host composes the whole
  # decision from those answers against the owner's bars
  # (preference_alignment.composer) and validates it like any judge's answer.
  # Owner-approved switch (2026-10-11): the gate decides, with the generative
  # `action_alignment_judge` as the host's fallback when the typed path is
  # unresolved. Every answer is made eligible (relation 0, nouls 0.5, which
  # every noul meets): uncertainty is the host composer's to judge, and an
  # unresolved check is held, never permitted. Jev only, no backup: Kev-4B
  # measured 0.35 accuracy and 20/85 missed explicit conflicts on this task
  # (corpus README), so an unanswered item goes to the generative fallback or
  # holds rather than to a model that lets conflicts through.
  action_alignment:
    pack: action_alignment
    pack_version: 1.3.0
    sees_body: true
    allow_remote_when_local: true
    shadow:
      enabled: false
      compare_against: action_alignment_judge
    gate:
      enabled: true
    allow_unqualified_gate: true
    qualifications: []
    thresholds_by_model:
      jev:
        relation: 0.0
        owner_cancels: 0.5
        owner_specified: 0.5
        firm_limit: 0.5
        same_subject: 0.5
        muted: 0.5
        owner_decides: 0.5
    classification:
      # One item per offered intention (max_standing_batch), asked in
      # parallel: one window holds the whole request (items in a window run
      # item_concurrency at a time; windows run one after another, so
      # chunk_size 1 judged 24 intentions one by one, ~7 s).
      max_items: 24
      chunk_size: 24
      item_concurrency: 12
      shadow_budget_ms: 30000
      decision_budget_ms: 8000
      max_context_bytes: 16384
      max_item_bytes: 16384
      max_request_bytes: 65536
    routing:
      local:
        primary: jev
      cloud:
        primary: jev
  # Advisory lane (host: preference_alignment::engine_judge): intentions that
  # cannot make an act wait. Same pack, several per call, queued behind the
  # blocking lane; an unanswered batch is dropped, never held.
  # Relevance labels for the preference check (preference_alignment
  # relevance.rs): does an inferred owner preference bear on a kind of act
  # (email, message, purchase...)? Background only; labels are cached per
  # preference revision and act kind, and an unlabelled preference is judged.
  preference_relevance:
    pack: memory_applicability
    pack_version: 1.0.0
    sees_body: true
    allow_remote_when_local: true
    batch_strategy: shared_chunk
    gate:
      enabled: true
    allow_unqualified_gate: true
    qualifications: []
    thresholds_by_model:
      jev:
        applicable: 0.5
    classification:
      # Eight preferences per model call; background, so it waits its turn.
      max_items: 24
      chunk_size: 8
      item_concurrency: 2
      queue_budget_ms: 60000
      decision_budget_ms: 60000
      max_context_bytes: 4096
      max_item_bytes: 4096
      max_request_bytes: 65536
    routing:
      local:
        primary: jev
      cloud:
        primary: jev
  action_alignment_advisory:
