<!doctype html>
<html lang="en" data-theme="sorbet" class="%sveltekit.theme%">
	<head>
		<!--
			A service-worker retirement script used to run here, as a second
			recovery path for the 0.0.774 marketing deploy: it called
			getRegistrations() on every marketing-host load and, where it found
			one, unregistered it, emptied CacheStorage and forced a whole second
			navigation. That cost was paid by every visitor for thirteen days to
			serve the shrinking few who still carried a stale registration.

			The worker tombstones in `scripts/marketing-site-headers` remain and
			retire those registrations on their own, without costing anything to
			anyone who does not have one. This shell is not the place for a
			migration.
		-->
		<!-- Synchronous theme initialization to prevent flash of wrong theme -->
		<script>
			(function() {
				try {
					var validThemes = [
						'sorbet',
						'sorbet-dark',
						'sky',
						'sky-dark',
						'candy',
						'candy-dark',
						'longhand',
						'longhand-dark',
						'arcane-terminal',
						'arcane-terminal-light',
						'retro-16bit',
						'retro-16bit-light',
						'mario-8bit',
						'mario-8bit-dark',
						'risograph',
						'risograph-dark',
						'mixtape',
						'mixtape-dark',
						'mono',
						'mono-dark',
						'cartoon',
						'cartoon-dark',
						'jarvis',
						'jarvis-light'
					];
					// Retired ids open as Sorbet, keeping their light/dark
					// side. Mirrors RETIRED_THEME_ALIASES in themeStore.ts.
					var retiredThemes = {
						'bubbly': 'sorbet',
						'bubbly-dark': 'sorbet-dark',
						'soft-machine': 'sorbet',
						'soft-machine-dark': 'sorbet-dark'
					};
					function resolveTheme(id) {
						if (validThemes.indexOf(id) !== -1) return id;
						if (id && Object.prototype.hasOwnProperty.call(retiredThemes, id)) return retiredThemes[id];
						return null;
					}
					var storedTheme = localStorage.getItem('magican-theme');
					var legacyTheme = localStorage.getItem('magician-theme');
					var initialTheme = resolveTheme(storedTheme)
						|| resolveTheme(legacyTheme)
						|| 'sorbet';
					document.documentElement.setAttribute('data-theme', initialTheme);
					// One-shot migration: always persist the resolved
					// theme (which is guaranteed valid from the list
					// above) and clear the legacy key. Earlier code
					// guarded this behind a hasStoredTheme check that
					// left invalid legacy values in place and caused
					// the migration to repeat on every reload.
					localStorage.setItem('magican-theme', initialTheme);
					localStorage.removeItem('magician-theme');
				} catch (e) {}
			})();
		</script>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="mask-icon" href="%sveltekit.assets%/safari-pinned-tab.svg" color="#1A1612" />

		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />


		<meta name="author" content="Magican" />







		<!-- Theme - Magican coral -->
		<meta name="theme-color" content="#ff6b6b" />
		<meta name="msapplication-TileColor" content="#ff6b6b" />

		<!--
			Theme fonts are optional paint, not an opening-page dependency. The
			old shell emitted twelve render-blocking Google Fonts stylesheets on
			every route; one asynchronous catalog replaced them and kept live
			theme switching intact.

			That catalog then carried all twenty-two families — 16KB of CSS and
			311 @font-face rules on every load of every route, measured against
			a landing page that renders exactly three of them. What stays here
			is the seven that `:root`, the `longhand` themes and the Sorbet and
			Sky pastel families resolve to (Nunito arrived with the pastels). The
			other sixteen belong to costume themes and are fetched by
			`$lib/shared/themeFonts` the moment such a theme is applied.

			The two halves are one set: if you add a family here, check whether
			it belongs in that module instead, and keep the axis and weight
			specs identical across both.
		-->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fredoka:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@200..800&family=Nunito:wght@400..800&family=Outfit:wght@100..900&family=Quicksand:wght@400;500;600;700&display=swap"
			rel="stylesheet"
			media="print"
			onload="this.media='all'"
		/>

		<!-- Title -->

		%sveltekit.head%

		<!-- Microsoft Clarity -->
		<script type="text/javascript">
			// Analytics is observational, never part of application readiness.
			// Loading the third-party tag in the document head made its variable
			// network latency dominate `load` (and, on cold Chrome runs, first
			// paint). Start it only after the page has loaded and the main thread is
			// idle; the bounded timeout still records ordinary browsing sessions.
			(function(c,l,a,r,i){
				// Operator opt-in only: an unset project must never record this deployment.
				if (!/^[a-z0-9]+$/i.test(i)) return;
				// Website consent never enables private app routes. Keep this closed
				// list aligned with isMarketingPath; mode crossings reload the document.
				var path = c.location.pathname.replace(/\/+$/, '') || '/';
				if (!['/', '/manifesto', '/privacy', '/terms'].includes(path)) return;
				// Local development sessions must not load the remote recording tag.
				var host = c.location.hostname;
				if (host === 'localhost' || host.endsWith('.localhost') ||
					/^127\./.test(host) || host === '[::1]' || host === '::1') return;
				c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
				function start(){
					function inject(){
						var t=l.createElement(r), y=l.getElementsByTagName(r)[0];
						t.async=1;t.src="https://www.clarity.ms/tag/"+i;
						y.parentNode.insertBefore(t,y);
					}
					if ('requestIdleCallback' in c) c.requestIdleCallback(inject, { timeout: 2500 });
					else c.setTimeout(inject, 1500);
				}
				if (l.readyState === 'complete') start();
				else c.addEventListener('load', start, { once: true });
			})(window, document, "clarity", "script", "%sveltekit.env.PUBLIC_CLARITY_PROJECT_ID%");
		</script>
	</head>
	<body data-sveltekit-preload-data="hover" class="antialiased">
		<script>
			// Settings opens behind its skeleton, not a blank page: on a phone the
			// app's code takes a few seconds over the tunnel. Same markup and
			// classes as lib/settings/SettingsSkeleton.svelte; the root layout
			// removes this copy as soon as it runs.
			(function () {
				if (!/^\/settings\/?$/.test(location.pathname)) return;
				var card = '<div class="msk-card"><div class="msk-bar msk-line msk-w30"></div><div class="msk-bar msk-line msk-title msk-w55"></div><div class="msk-bar msk-line msk-w90"></div><div class="msk-bar msk-line msk-w75"></div><div class="msk-bar msk-pill"></div></div>';
				var chip = '<div class="msk-bar msk-chip"></div>';
				var el = document.createElement('div');
				el.id = 'settings-boot-skeleton';
				el.className = 'msk';
				el.setAttribute('role', 'status');
				el.setAttribute('aria-label', 'Loading settings');
				el.innerHTML = '<div class="msk-in"><div class="msk-bar msk-search"></div><div class="msk-chips">' + chip + chip + chip + chip + '</div><div class="msk-bar msk-heading"></div>' + card + card + card + card + '</div>';
				document.body.appendChild(el);
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>

		<!-- Minimal global styles - Multi-theme support -->
		<style>
			/* Essential resets only */
			*, *::before, *::after {
				box-sizing: border-box;
			}

			/* Theme-adaptive font (uses CSS variable from app.css) */
			body, html {
				font-family: var(--font-primary, 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif);
				background: var(--bg-base, #fdfcf8);
				color: var(--text-primary, #2d3436);
				transition: background 0.3s ease, color 0.3s ease;
			}

			/* (Note: html-level scrollbar-gutter was tested and reverted —
			   the document itself doesn't typically scroll because the
			   v5 .layout-v5 owns viewport overflow. Reserving page-level
			   gutter caused a worse mismatch. Gutter is now reserved on
			   the actually-scrolling .v5-main container only.) */

			/* Settings skeleton (app.html boot copy + SettingsSkeleton.svelte).
			   Translucent ink on the page colour, so it reads on every theme and
			   before app.css arrives. */
			.msk {
				position: fixed;
				inset: 0;
				z-index: 40;
				overflow: hidden;
				padding: 16px;
				background: var(--bg-base, #fdfcf8);
			}
			.msk-in {
				display: flex;
				flex-direction: column;
				gap: 14px;
				margin: 0 auto;
				width: min(100%, 760px);
			}
			.msk-bar {
				background: color-mix(in srgb, var(--text-primary, #2d3436) 9%, transparent);
				border-radius: 8px;
				overflow: hidden;
				position: relative;
			}
			.msk-bar::after {
				animation: msk-sheen 1.4s ease-in-out infinite;
				background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--bg-base, #fdfcf8) 65%, transparent), transparent);
				content: '';
				inset: 0;
				position: absolute;
				transform: translateX(-100%);
			}
			.msk-search { border-radius: 10px; height: 44px; }
			.msk-chips { display: flex; gap: 8px; overflow: hidden; }
			.msk-chip { border-radius: 999px; flex: none; height: 36px; width: 9.5rem; }
			.msk-heading { height: 24px; margin-top: 8px; width: 55%; }
			.msk-card {
				background: var(--bg-card, #ffffff);
				border: 1px solid color-mix(in srgb, var(--text-primary, #2d3436) 10%, transparent);
				border-radius: 8px;
				display: flex;
				flex-direction: column;
				gap: 10px;
				padding: 16px;
			}
			.msk-line { height: 11px; }
			.msk-title { height: 18px; }
			.msk-w30 { width: 30%; }
			.msk-w55 { width: 55%; }
			.msk-w75 { width: 75%; }
			.msk-w90 { width: 90%; }
			.msk-pill { border-radius: 6px; height: 32px; width: 7rem; }
			@keyframes msk-sheen { to { transform: translateX(100%); } }
			@media (prefers-reduced-motion: reduce) { .msk-bar::after { display: none; } }

			/* Focus styles for accessibility - theme-adaptive */
			:focus-visible {
				outline: 2px solid var(--accent-primary, #ff6b6b);
				outline-offset: 2px;
			}

			/* Reduced motion support */
			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					animation-duration: 0.01ms !important;
					animation-iteration-count: 1 !important;
					transition-duration: 0.01ms !important;
				}
			}
		</style>
	</body>
</html>
