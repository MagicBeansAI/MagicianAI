[package]
name = "magician-surfaces"
version = "0.1.2"
edition = "2021"
authors = ["MagicBeansAI"]
description = "Near-free surface modules (thinking maps, progress channels, evals, counterparties) extracted from the magician monolith"
license = "MIT OR Apache-2.0"

[features]
# Fixture/eval modules shared with dependent crates' test builds.
test-fixtures = []

[dependencies]
magician = { path = "../magician" }
magicllm = { path = "../magicllm" }
magician-media = { path = "../magician-media" }

anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { version = "4.0", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.12.28", features = ["json", "stream", "rustls-tls", "multipart", "system-proxy"] }
serde = { workspace = true, features = ["derive"] }
tempfile = "3.8"
thiserror = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
magician = { path = "../magician", features = ["test-fixtures"] }
tempfile = "3.8"
