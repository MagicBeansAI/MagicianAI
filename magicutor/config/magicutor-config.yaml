server:
  host: "0.0.0.0"
  port: 3003
  # SSE backchannel for streaming ActionImpact events (GD-B01)
  # Clients connect to GET /events/{correlation_id}
  # Events are filtered to dom_changes.total_changes > 0

bridge:
  enabled: true
  path: "/bridge/native"
  auth_token: ""
  # Browsers (profiles, Chromium forks) that may hold the bridge at once.
  max_connections: 4
  # Seconds a run that asks "which browser?" waits before using the default.
  browser_choice_timeout_secs: 20
  # Where a task's tabs open: auto (a "✱ <task>" tab group in your window,
  # else a group in a window of its own, else a plain window), in_window,
  # or own_window (skip the in-window step).
  automation_surface: auto
  # Peers trusted like loopback (addresses or CIDRs). Containers add their
  # default gateway through MAGICUTOR_TRUSTED_PEERS (container-entrypoint.sh).
  trusted_peers: []
  # Host names (besides localhost and IP literals) trusted peers may use to
  # reach Magicutor; guards against DNS rebinding. Also MAGICUTOR_ALLOWED_HOSTS.
  allowed_hosts: []
