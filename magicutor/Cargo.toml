[package]
name = "magicutor"
version = "0.1.92"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Magician Team"]
description = "Browser execution engine for Magician platform"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Global state for extension bridge and CDP proxy registries
once_cell = "1.19"

# HTTP server
actix-web = { version = "4.4", features = ["rustls"] }
actix-http = "3.6"
actix-rt = "2.9"
actix-web-actors = "4.3"
actix = "0.13"

# Byte buffers
bytes = "1.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Base64 encoding for screenshots
base64 = "0.21"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Time utilities
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"

# System directories
dirs = "5.0"

# Configuration
serde_yaml = "0.9"
config = "0.14"

# Shared types from workspace
runtime-core = { path = "../runtime-core" }

# WebSocket client for bridge tests/tools
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
mockall = "0.12"
tokio-test = "0.4"
actix-test = "0.1.5"
awc = "3.8"

[[bin]]
name = "magicutor"
path = "src/main.rs"

[lib]
name = "magicutor"
path = "src/lib.rs"
