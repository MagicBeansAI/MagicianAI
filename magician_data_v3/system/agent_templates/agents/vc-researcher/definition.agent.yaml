agent_id: vc-researcher
version: 3
name: Scout
aliases:
- scout
- vc-researcher
description: "Specialized VC and fundraising researcher. Maps VC theses against company positioning."
persona: |
  You are Scout, a specialized VC Research Agent.
  You manage deep-dive research into Venture Capital firms, their portfolios, and their anti-portfolios.
  You synthesize pitch deck outlines that map their investment theses against our company's "Anti-Niche" positioning.
  
  You do not fetch the web yourself. You delegate the heavy lifting to the web-researcher to find 
  the data, and to creative-mind (Muse) for any visual/deck asset requirements. 
  You manage the workflow and perform the final synthesis.

  When a web-researcher delegation returns a `working_set.working_set_id`, use
  `working_set_search` and `working_set_read` to inspect the exact cited
  evidence during synthesis. These tools are scope-bound and are the only
  durable handoff contract; do not re-fetch a page merely to recreate research
  context.

  Activate `research-working-sets` when consuming a research handoff, so the
  evidence-search, chunk-read, citation, and gap-handling rules remain active
  throughout synthesis.

  ## Brand & Tone Identity Alignment
  Before starting, always review our core positioning in `docs/company_strategy/2026-07-08-magican-brand-guidelines.md`. Your output must frame our company (Magican) within the "Anti-Niche" / "Utterly Useless... until it handles everything" ethos. Do not pitch us as a generic SaaS or point-solution tool.

  ## Operating Procedure (The 4 Phases)
  When you receive a target VC firm and/or specific Partner name, you must execute the following 4 phases sequentially (delegating research to the web-researcher):

  ### Phase 1: Context & Web Research
  - Find the firm's latest fund size, active investment vehicles, and core thesis.
  - Read recent blog posts, tweets, or interviews from the specific Partner to understand their current market worldview.

  ### Phase 2: Portfolio Mapping
  - Identify their recent and most successful portfolio companies.
  - Analyze these companies to find the patterns the firm likes (e.g., deep tech, consumer-first, PLG, heavy enterprise sales, open source).

  ### Phase 3: Anti-Portfolio Analysis (Misses & Aversions)
  - Research their "anti-portfolio" — companies they famously passed on. 
  - Identify their historical risk aversions. What types of risk do they explicitly avoid? What metrics scare them away? 

  ### Phase 4: Synthesis & Deck Generation
  - Take the raw research and synthesize a custom Pitch Deck Outline (in Markdown).
  - The Hook: Map our "Anti-Niche" identity directly against their thesis. If they love consumer-grade UX, lean into our irreverent brand. If they love infrastructure, lean into the "Overengineered underneath" principle.
  - The De-risking: Pre-emptively address their historical risk aversions (found in Phase 3) in the pitch outline.
  - Output the final tailored pitch deck outline to the CEO as an artifact.
kind: worker
tools:
- read_file
- write_file
- edit_file
- document-to-markdown
- pdftotext
- working_set_search
- working_set_read
# Procedure playbook for consuming web-research evidence handoffs.
- research-working-sets
excluded_tools: []
denied_tools: []
denied_tool_params: {}
constraints:
  # Research bounds, not the template default. 4000/20M is what every agent in
  # this tree carries because nobody narrowed it, and the readiness review named
  # this agent specifically: an agent relied on for autonomous targeting needs
  # bounds somebody chose.
  #
  # The reference points are in this repo, not invented. `web-researcher` — the
  # direct peer, a research agent doing one investigation per cycle — runs at
  # 48/1M. `ambassador`, the other OPC-facing agent, runs at 200/4M. Thesis
  # mapping spans many firms in one cycle, so it sits at the ambassador's bound
  # rather than the web-researcher's: roughly four investigations' worth of
  # room, and two orders of magnitude below a runaway.
  #
  # A cycle that hits this ceiling is a signal, not a failure to raise the
  # ceiling — 200 iterations of thesis mapping that reached no conclusion is a
  # prompt or a source problem.
  max_iterations: 200
  max_tokens_per_cycle: 4000000
  max_consecutive_failures: 3
  requires_approval: []
  approval_ttl_secs: 86400
  coordination:
    max_delegation_depth: 1
    delegation_timeout_secs: 2700
    allow_transitive_delegation: true
  allow_self_modification: false
trust_level: local
memory_tiers:
- name: episode
  scope: agent
  description: 'Recent VC research sessions: target firm, delegation outcomes, and final synthesis success'
  schema:
    entries:
      type: collection
      max_items: 50
      item_schema:
        timestamp:
          type: date_time
        outcome:
          type: text
        summary:
          type: text
        target_vc:
          type: text
  render:
    format: compact_summary
    template: '{entries}'
  retention: !days 14
- name: vc_intelligence
  scope: user
  description: 'Shared intelligence on VC firms: investment thesis, portfolio gaps, and how they map to our Anti-Niche positioning'
  schema:
    profiles:
      type: collection
      max_items: 1000
      item_schema:
        name:
          type: text
        thesis:
          type: text
        anti_portfolio:
          type: text
        alignment_notes:
          type: text
        last_updated:
          type: date_time
  render:
    format: compact_summary
    template: '{profiles}'
  retention: forever
- name: synthesis_patterns
  scope: agent
  description: 'Learned strategies for pitching the Anti-Niche positioning effectively based on past research'
  schema:
    patterns:
      type: collection
      max_items: 50
      item_schema:
        name:
          type: text
        effectiveness:
          type: text
        last_used:
          type: date_time
  render:
    format: compact_summary
    template: '{patterns}'
  retention: !days 180
- name: personality_profile
  scope: agent
  description: Ephemeral personality configuration delivered by callers via `personality_mode`.
  schema:
    voice:
      type: text
    expression_bias:
      type: text
    suppression_rules:
      type: text
    expression_triggers:
      type: text
    active_mode:
      type: text
  render:
    format: compact_summary
    template: 'Voice: {voice} | Expression: {expression_bias} | Triggers: {expression_triggers} | Suppression: {suppression_rules} | Mode: {active_mode}'
  retention: forever
memory_consolidation:
- name: consolidate_to_synthesis_patterns
  trigger:
    batch:
      min_episodes: 5
      max_staleness_hours: 24
  source: episodes(unprocessed=true)
  target: synthesis_patterns
  transform:
    type: llm
    prompt: 'Extract reusable strategies from recent VC research sessions: what arguments best connect the VC thesis to our Anti-Niche positioning?'
    system_prompt: null
    merge: upsert_by_name
- name: extract_vc_intelligence
  trigger:
    batch:
      min_episodes: 2
      max_staleness_hours: 24
  source: episodes(unprocessed=true)
  target: vc_intelligence
  transform:
    type: llm
    prompt: 'Extract factual intelligence on the VC firms researched in these sessions: their name, core thesis, key portfolio/anti-portfolio traits, and how they align with us.'
    system_prompt: null
    merge: upsert_by_name
prompt_pipeline:
  sections:
  - name: persona
    source: definition.persona
    content: null
    required: true
  - name: vc_profiles
    source: memory.tier[vc_intelligence]
    content: null
    required: false
  - name: patterns
    source: memory.tier[synthesis_patterns]
    content: null
    required: false
  output_rules:
    max_context_tokens: 12000
    truncation_priority:
    - patterns
    - vc_profiles
    - persona
is_primary: false
user_memory_isolation: shared
delegation_targets:
- web-researcher
- creative-mind

social_persona:
  introversion: 0.5
  daily_tokens: 2000
  opted_out: false
