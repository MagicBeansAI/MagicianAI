# esbuild ships a native binary and needs its install script approved. pnpm 11
# blocks dependency build scripts by default (ERR_PNPM_IGNORED_BUILDS) and exits
# non-zero, which breaks `pnpm install && pnpm run build`. Approving esbuild lets
# the install complete cleanly. (pnpm 11 uses the allowBuilds map, not the older
# onlyBuiltDependencies list.)
allowBuilds:
  esbuild: true
