      <stop offset="0.56" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#ff69cf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbitB" x1="252" y1="196" x2="778" y2="814" gradientUnits="userSpaceOnUse">
