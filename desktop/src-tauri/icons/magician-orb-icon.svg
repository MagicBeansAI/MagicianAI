    <circle cx="512" cy="512" r="304" fill="none" stroke="url(#rim)" stroke-width="14"/>
    <ellipse cx="398" cy="336" rx="110" ry="68" transform="rotate(-30 398 336)" fill="#ffffff" opacity="0.34"/>
    <ellipse cx="360" cy="300" rx="48" ry="30" transform="rotate(-30 360 300)" fill="#ffffff" opacity="0.46"/>
