<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Magician orb app icon</title>
  <desc id="desc">A luminous colorful sphere for the Magician desktop app.</desc>
  <defs>
    <linearGradient id="bg" x1="96" y1="84" x2="928" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#091c33"/>
      <stop offset="0.45" stop-color="#071120"/>
      <stop offset="1" stop-color="#1c1239"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="44%" r="68%">
      <stop offset="0" stop-color="#32f4ff" stop-opacity="0.34"/>
      <stop offset="0.52" stop-color="#7a5cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="36%" cy="27%" r="76%">
      <stop offset="0" stop-color="#f7ffff"/>
      <stop offset="0.13" stop-color="#a9ffff"/>
      <stop offset="0.34" stop-color="#25ddff"/>
      <stop offset="0.59" stop-color="#6066ff"/>
      <stop offset="0.82" stop-color="#b642ff"/>
