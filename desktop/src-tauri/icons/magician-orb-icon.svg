      <stop offset="0.62" stop-color="#59f8ff" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#845cff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="iris" cx="36%" cy="34%" r="68%">
