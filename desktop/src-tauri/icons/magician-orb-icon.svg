      <feDropShadow dx="0" dy="0" stdDeviation="42" flood-color="#10dfff" flood-opacity="0.54"/>
      <feDropShadow dx="0" dy="0" stdDeviation="82" flood-color="#8f48ff" flood-opacity="0.28"/>
