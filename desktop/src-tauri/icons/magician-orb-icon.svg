      <circle cx="512" cy="482" r="47" fill="url(#iris)"/>
      <circle cx="522" cy="492" r="23" fill="#050712"/>
      <circle cx="493" cy="456" r="15" fill="#ffffff" opacity="0.92"/>
      <circle cx="508" cy="468" r="6" fill="#ffffff" opacity="0.72"/>
      <path d="M426 457 C462 406 558 400 599 452"
        fill="none"
        stroke="#081326"
        stroke-opacity="0.5"
        stroke-width="15"
        stroke-linecap="round"/>
      <path d="M450 604 C486 632 542 632 576 602"
        fill="none"
        stroke="#081326"
        stroke-opacity="0.42"
        stroke-width="16"
        stroke-linecap="round"/>
      <circle cx="398" cy="548" r="14" fill="#ff8fd8" opacity="0.32"/>
      <circle cx="626" cy="548" r="14" fill="#ff8fd8" opacity="0.3"/>
    </g>
