      <stop offset="0.72" stop-color="#c47bff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ff78d7" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="orbitA" x1="154" y1="418" x2="862" y2="642" gradientUnits="userSpaceOnUse">
