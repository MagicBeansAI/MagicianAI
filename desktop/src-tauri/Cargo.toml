[package]
name = "magician-desktop"
version = "0.3.18"
edition = "2021"
description = "Magican Desktop - system tray app for managing containerized Magician"
license = "MIT OR Apache-2.0"

[features]
# Native desktop wake word (Vosk in Rust). Off by default so `cargo build` /
# `cargo check` / tests don't require `libvosk`; the desktop-wake build enables
# it (`make build-desktop-tray-debug` / `release-desktop` pass `--features native-wake`).
native-wake = ["dep:vosk"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks", "limits"] }
async-trait = "0.1"
dirs = "5"
open = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
blake3 = "1.0"
ring = "0.17.14"
keyring = "2.3"
zeroize = "1.7"
libc = "0.2"
magician-app-contract = { path = "../../magician-app-contract" }
magician-components = { path = "../../magician-components" }
runtime-core = { path = "../../runtime-core" }
uuid = { version = "1.0", features = ["v4"] }
cpal = "0.15"
hound = "3"
# Native desktop wake-word (Vosk in Rust), behind the `native-wake` feature (off
# by default so plain builds/checks don't need libvosk). Links `libvosk` — see
# the desktop README / wake-word plan for the model + lib setup.
vosk = { version = "0.3", optional = true }
futures-util = "0.3"
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
keepawake = "0.6.0"
flate2 = "1"
tar = "0.4"
tempfile = "3"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2"

[target."cfg(target_os = \"macos\")".dependencies]
# The orb is an auxiliary, non-activating AppKit panel rather than a normal
# application window. Pin the maintained Tauri v2.1 branch until the plugin is
# published on crates.io.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
# Raw AppKit access for the HUD window — sets NSWindow level above
# the menu bar so Quick Automate's HUD covers every pixel including
# the system menu bar area (without using macOS Spaces fullscreen,
# which would put the HUD in a separate desktop). Used in
# `overlay::fill_screen`.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSBundle", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSScreen", "NSWorkspace", "libc"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.25"
security-framework = "3.7"
security-framework-sys = "2.17"

# Historical HUD vibrancy dependency. The current HUD keeps the
# window transparent and applies local CSS backdrop filters in the
# unified-ui `/hud` route; remove this after a dedicated desktop
# build/check confirms no older window path still references it.
window-vibrancy = "0.5"

# The typed Apps macOS owner blake3-hashes the whole staged CuaDriver.app
# (~73 MB) several times per action. Unoptimised, blake3 loses its SIMD paths
# and a debug build spent ~27 s per action hashing; release is unaffected.
[profile.dev.package.blake3]
opt-level = 3
