name: inspect_agent
description: Inspect saved and loaded agent settings, scheduler registrations and routing. Harness agents also receive operating details within their delegation scope.
version: "1.0.0"
result_projection:
  contract_id: generic_json_v1
  priority_fields:
    - runtime_metadata
    - agents
    - configured_router_defaults
    - routing_evidence
    - status
    - agent
    - context
guide: |
  Tool name: `inspect_agent`

  Use this after `list_agents` when you need the full definition and current operating context
  for one subordinate agent.
  Harness results include runtime_metadata: saved versus cached runtime definitions,
  durable scheduler registrations and model-routing settings, limited to your active
  delegation/focus scope. Use this before shell/source/config investigations.
  Explicitly granted personal agents without a harness receive metadata only,
  excluding task/episode content and hidden agents. Inspection grants no control. Router defaults are
  configuration evidence, not proof of which model a future call will use.
  Runtime metadata includes scoped source paths/hashes, loaded-at timestamps, program
  prompt-assembly receipts, registration identities/admission flags and resolved routing.
  Missing historical receipts mean unknown, never proof that an agent did not run.
parameters:
  - name: agent_id
    required: true
    param_type: string
    description: Agent id in this workspace (runtime metadata), or the active harness scope (full details).
  - name: recent_episode_limit
    param_type: integer
    description: Maximum number of recent episode summaries to include. Defaults to 10.
    default: "10"
  - name: routing_context
    param_type: object
    description: Optional read-only routing scenario; operations (1-32 names; defaults to core workflow operations), has_tools (default true), has_images (false), parent_engine, model_override, run_overrides. Resolves through the real dispatcher without making a model call or changing settings.
implementation:
  type: compiled
  provider_name: inspect_agent
execution:
  requires_browser_session: false
  default_timeout_secs: 10
  categories:
    - harness
    - diagnostics
    - agents
  composition_category: observation
  sandbox: none
