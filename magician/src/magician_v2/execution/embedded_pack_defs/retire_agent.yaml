name: retire_agent
description: Propose retiring a subordinate agent. Approval-backed in the initial release.
version: "1.0.0"
guide: |
  Tool name: `retire_agent`

  Use this when an agent should be deactivated after repeated evidence of mismatch,
  instability, or redundancy. Approval applies the definition revision and pauses the agent.

  Guidelines:
  - target only agents already inside the active harness scope
  - cite concrete evidence in `evidence_refs`
  - use `summary` for the decision-ready recommendation
parameters:
  - name: agent_id
    required: true
    param_type: string
    description: Target agent id inside the active harness scope.
  - name: summary
    required: true
    param_type: string
    description: Short rationale for retiring the agent.
  - name: rationale
    param_type: string
    description: Optional longer explanation for the reviewer.
  - name: evidence_refs
    required: true
    description: Non-empty list of evidence references backing the proposal.
    schema:
      type: array
      items: { type: string }
      minItems: 1

  - name: payload
    description: Optional structured metadata to persist alongside the proposal.
    schema:
      type: object
      additionalProperties: true

implementation:
  type: compiled
  provider_name: retire_agent
execution:
  requires_browser_session: false
  default_timeout_secs: 15
  categories:
    - harness
    - structure
    - approval
  composition_category: action
  sandbox: none
