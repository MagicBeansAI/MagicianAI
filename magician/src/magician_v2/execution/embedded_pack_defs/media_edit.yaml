name: media_edit
description: Edit audio/video files with ffmpeg. Pick one operation and pass its params. Ordinary calls return a background job_id; bounded task calls await completion at their declared output_path.
version: "1.2.0"
guide: |
  Tool name: `media_edit`

  Backgrounded ffmpeg-based media editing. This call returns immediately
  with a `job_id`; the actual ffmpeg run happens asynchronously. Follow up
  with `media_edit_status(job_id)` until it reports `completed` or `failed`.

  A bounded task with an admitted media work area instead supplies
  `output_path` and one `input_media_types` entry per input (video/mp4,
  video/webm, audio/mpeg, audio/wav, image/png, image/jpeg, image/webp or
  image/x-portable-pixmap for a PPM raster).
  It awaits completion, writes within that work area and returns the final
  path directly. Thumbnail sampling requires an explicit timestamp_secs.

  Operations and their `params`:
  - `trim` — {start_secs, end_secs, fast?}. Cut a time range out of a video.
  - `speed` — {factor}. Speed up (>1) or slow down (<1) a video, audio pitch-corrected.
  - `extract_audio` — {} (no params). Pull the audio track out as an mp3.
  - `mute_video` — {} (no params). Strip the audio track, keep the video.
  - `convert` — {format, width?, height?}. Transcode container/codec and optionally resize.
  - `still_to_video` — {duration_secs, frame_rate?, width?, height?}. Turn one PNG, JPEG, WebP or PPM still into a silent H.264 MP4. A PPM raster can be written as plain P3 text using files; PNG/JPEG/WebP may come from any admitted image tool or supplied source. Duration and frame rate must be positive; frame rate defaults to 25. Supplied dimensions must be even; an omitted dimension auto-scales. With neither supplied, odd source edges are padded to even dimensions.
  - `merge` — {sync_offset_ms?}. Combine a video input and an audio input into one file. Requires `input_paths: [video_path, audio_path]`. `sync_offset_ms` shifts audio relative to video to fix drift.
  - `concat` — {include_audio?}. Join compatible `input_paths` (2+) in the given order. Default true requires audio in every clip. Set false to compose only video, including silent clips; no audio stream is produced. Inputs must have matching video dimensions and compatible frame rates.
  - `overlay_text` — {text, position?, font_size?}. Burn in a caption/watermark.
  - `thumbnail` — {timestamp_secs?}. Grab one still frame as a PNG. Omit `timestamp_secs` for the clip's midpoint.

  `input_paths` are resolved inside the caller's workspace, same rules as
  `read_file`/`write_file`.
parameters:
  - name: operation
    required: true
    param_type: string
    description: One of trim, speed, extract_audio, mute_video, convert, still_to_video, merge, concat, overlay_text, thumbnail.
  - name: input_paths
    required: true
    param_type: array
    description: "Workspace-relative or absolute paths to the input file(s), in operation-defined order (most ops take one; merge takes [video, audio]; concat takes 2+)."
  - name: params
    required: false
    param_type: object
    description: Operation-specific parameters — see the guide above for each operation's shape.
  - name: output_path
    required: false
    param_type: string
    description: Declared output path for a bounded task; must stay in its admitted work area.
  - name: input_media_types
    required: false
    param_type: array
    description: Declared input formats for a bounded task, in input_paths order.
implementation:
  type: compiled
  provider_name: media_edit
execution:
  requires_browser_session: false
  default_timeout_secs: 1800
  categories:
    - media
  composition_category: action
  sandbox: none
