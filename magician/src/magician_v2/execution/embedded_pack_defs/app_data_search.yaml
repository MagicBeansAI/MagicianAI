name: app_data_search
description: Search one enabled app installation with a contains predicate over an approved field. Delegated, outward and app-workflow callers fail closed.
version: "2.0.0"
result_projection:
  contract_id: app_search_projection_v1
  records_paths:
    - /page/envelope/value
  priority_fields:
    - status
    - error_code
    - projection_handle
    - handle_ref
    - expires_at
    - entity
    - record_id
    - record_revision
    - next_cursor
guide: |
  Tool name: `app_data_search`

  Use after `app_discover` for owner-facing lookup of app records by text. The grant must
  allow personal-agent search on that entity. An optional canonical predicate
  is ANDed with the contains match; ordering, opaque cursor replay and bounded
  relations use the same query contract as `app_data_query`. Compose accepted
  projections into another app with `app_data_compose`. Preserve the returned
  `projection_handle.handle_ref`; composition consumes that small reference.
parameters:
  - name: installation_id
    required: true
    param_type: string
    description: Enabled installation to search.
    schema: {type: string, minLength: 1}
  - name: entity
    required: true
    param_type: string
    description: Entity name declared by the app schema.
    schema: {type: string, minLength: 1, maxLength: 64}
  - name: query
    required: true
    param_type: string
    description: Text to match with contains.
    schema: {type: string, minLength: 1, maxLength: 4096}
  - name: field
    param_type: string
    description: Approved field to search. Defaults to title.
    default: title
    schema: {type: string, minLength: 1, default: title}
  - name: select
    param_type: array
    description: Optional projection field list.
    schema:
      type: array
      minItems: 1
      maxItems: 256
      uniqueItems: true
      items:
        type: string
        minLength: 1
  - name: predicate
    param_type: object
    description: Optional canonical bounded filter arena ANDed with the contains match. Use kind is_null for null checks; compare/in values are non-null scalars.
    schema:
      type: object
      additionalProperties: false
      required: [root, nodes]
      properties:
        root: {type: integer, minimum: 0, maximum: 65535}
        nodes:
          type: array
          minItems: 1
          maxItems: 126
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [kind, children]
                properties:
                  kind: {const: all}
                  children:
                    type: array
                    minItems: 1
                    maxItems: 256
                    uniqueItems: true
                    items: {type: integer, minimum: 0, maximum: 65535}
              - type: object
                additionalProperties: false
                required: [kind, children]
                properties:
                  kind: {const: any}
                  children:
                    type: array
                    minItems: 1
                    maxItems: 256
                    uniqueItems: true
                    items: {type: integer, minimum: 0, maximum: 65535}
              - type: object
                additionalProperties: false
                required: [kind, child]
                properties:
                  kind: {const: not}
                  child: {type: integer, minimum: 0, maximum: 65535}
              - type: object
                additionalProperties: false
                required: [kind, field, operator, value]
                properties:
                  kind: {const: compare}
                  field: {type: string, minLength: 1}
                  operator:
                    enum: [equal, not_equal, less_than, less_than_or_equal, greater_than, greater_than_or_equal, contains, starts_with]
                  value: {type: [string, number, boolean], maxLength: 4096}
              - type: object
                additionalProperties: false
                required: [kind, field, values]
                properties:
                  kind: {const: in}
                  field: {type: string, minLength: 1}
                  values:
                    type: array
                    minItems: 1
                    maxItems: 256
                    items: {type: [string, number, boolean], maxLength: 4096}
              - type: object
                additionalProperties: false
                required: [kind, field]
                properties:
                  kind: {const: is_null}
                  field: {type: string, minLength: 1}
                  negated: {type: boolean, default: false}
  - name: order
    param_type: array
    description: Optional unique field/direction ordering entries.
    schema:
      type: array
      maxItems: 256
      items:
        type: object
        additionalProperties: false
        required: [field, direction]
        properties:
          field: {type: string, minLength: 1}
          direction: {enum: [ascending, descending]}
  - name: cursor
    param_type: string
    description: Opaque next_cursor returned by a prior identical search.
    schema: {type: string, minLength: 1}
  - name: limit
    param_type: integer
    description: Maximum rows in [1, 200]. Defaults to 20.
    default: "20"
    schema: {type: integer, minimum: 1, maximum: 200, default: 20}
  - name: relation_expansions
    param_type: array
    description: Optional bounded declared relation projections with select, max_depth and max_rows.
    schema:
      type: array
      maxItems: 256
      items:
        type: object
        additionalProperties: false
        required: [relation, select, max_depth, max_rows]
        properties:
          relation: {type: string, minLength: 1}
          select:
            type: array
            minItems: 1
            maxItems: 256
            uniqueItems: true
            items: {type: string, minLength: 1}
          max_depth: {type: integer, minimum: 1, maximum: 16}
          max_rows: {type: integer, minimum: 1, maximum: 200}
implementation:
  type: compiled
  provider_name: app_data_search
execution:
  requires_browser_session: false
  default_timeout_secs: 15
  categories:
    - apps
    - search
  composition_category: action
  sandbox: none
reliability:
  read_only: true
  idempotent: true
