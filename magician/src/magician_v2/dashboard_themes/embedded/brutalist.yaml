id: brutalist
name: Brutalist
description: Heavy mono display, sharp 0-radius corners, high-contrast color blocks, grid-aligned everything. Accent loud but sparing.
best_for: System status dashboards, raw-data viewers, debug surfaces, internal tooling that prizes information density over polish.

fonts:
  display:
    family: "'Space Grotesk', 'Helvetica Neue', sans-serif"
    url: "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
    weights: [500, 700]
  body:
    family: "'IBM Plex Sans', 'Helvetica Neue', sans-serif"
    url: "https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&display=swap"
    weights: [400, 500, 700]
  mono:
    family: "'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace"
    url: "https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap"
    weights: [400, 500, 700]

palette:
  background: "#F4F4F0"
  surface: "#FFFFFF"
  foreground: "#0A0A0A"
  foreground_muted: "#525252"
  accent: "#FF3B00"
  accent_alt: "#0050FF"
  chart_colors:
    - "#FF3B00"
    - "#0A0A0A"
    - "#0050FF"
    - "#FFC400"
    - "#00A86B"
    - "#9D00FF"
    - "#525252"
    - "#FF00C8"
  border: "#0A0A0A"
  shadow: "rgba(10, 10, 10, 0.12)"

spacing:
  container_max_width_px: 1200
  container_padding_x_px: 24
  container_padding_y_px: 32
  block_gap_px: 16
  prose_line_height: 1.45
  heading_scale: 1.18

atmosphere:
  kind: flat
  intensity: 0.0

motion:
  load_stagger_ms: 30
  load_duration_ms: 200
  load_easing: cubic-bezier(0.1, 0.9, 0.2, 1)
  hover_lift_px: 0
  scroll_reveal: false
