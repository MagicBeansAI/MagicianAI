id: terminal
name: Terminal
description: Green-on-black, full mono, scanline atmosphere, hard-cut motion. Bloomberg / DOS aesthetic.
best_for: Real-time system telemetry, ops surfaces, anything that should feel like a control panel — high information density, ambient seriousness.

fonts:
  display:
    family: "'Berkeley Mono', 'JetBrains Mono', ui-monospace, monospace"
    url: "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap"
    weights: [500, 700]
  body:
    family: "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
    url: "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
    weights: [400, 500]
  mono:
    family: "'JetBrains Mono', ui-monospace, SFMono-Regular, monospace"
    url: "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
    weights: [400, 500, 700]

palette:
  background: "#0A0E0A"
  surface: "#11150F"
  foreground: "#3EE07F"
  foreground_muted: "#5B8B6A"
  accent: "#7FFF00"
  accent_alt: "#FFB81E"
  chart_colors:
    - "#7FFF00"
    - "#FFB81E"
    - "#00E5FF"
    - "#FF4F8B"
    - "#A0FF00"
    - "#FF6E00"
    - "#62FFB3"
    - "#FFEA00"
  border: "rgba(126, 255, 0, 0.18)"
  shadow: "rgba(126, 255, 0, 0.12)"

spacing:
  container_max_width_px: 1200
  container_padding_x_px: 20
  container_padding_y_px: 24
  block_gap_px: 12
  prose_line_height: 1.35
  heading_scale: 1.15

atmosphere:
  kind: scanlines
  intensity: 0.08

motion:
  load_stagger_ms: 20
  load_duration_ms: 120
  load_easing: steps(4, end)
  hover_lift_px: 0
  scroll_reveal: false
