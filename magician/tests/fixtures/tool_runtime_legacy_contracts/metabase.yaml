  table_list:
    description: |
      Run `table list` — list tables. Typed filters; the JSON Schema
      validator rejects malformed shapes before the call leaves the LLM,
      so the previous `--can-query` / `--term` arity failures are now
      impossible by construction. Use `extra_args` only for flags this
      schema does not surface (rare).
    argv:
      - table
      - list
    parameters:
      - term
      - can_query
      - data_source
      - extra_args
    required: []
    timeout_secs: 60
    parameter_overrides:
      term:
        type: string
        description: Case-insensitive substring filter on table name.
      can_query:
        type: boolean
        description: When true, only return tables this API key can query. When false, includes tables the key cannot read.
      data_source:
        type: integer
        description: Restrict listing to one database id.
      extra_args:
        type: array
        items:
          type: string
        description: Escape hatch — additional argv tokens for flags this schema does not yet surface.
    arg_mappings:
      - type: flag
        flag: --term
        param: term
      - type: flag
        flag: --can-query
        param: can_query
      - type: flag
        flag: --data-source
        param: data_source
      - type: passthrough
        param: extra_args
  table_get:
    description: Run `table get <id>` — table metadata.
    argv:
      - table
      - get
    parameters:
      - table_id
      - extra_args
    required:
      - table_id
    parameter_overrides:
      table_id:
        type: integer
        description: Numeric Metabase table id.
      extra_args:
        type: array
        items:
          type: string
        description: Escape hatch — extra argv tokens.
    arg_mappings:
      - type: positional
        param: table_id
      - type: passthrough
        param: extra_args
    timeout_secs: 60
  table_query_metadata:
