name: metabase
version: 0.1.0
description: Discover and query Metabase databases, models, cards, dashboards, and metrics, export results, and maintain reusable Metabase BI assets.
parameters:
  - name: command
    required: true
    param_type: string
    description:
      Outer-loop fallback command string forwarded to metabase.sh, e.g. "card list". Ignored while implementation.type
      is primitive.
  - name: timeout_secs
    param_type: integer
    description: Command timeout in seconds
    default: "60"
native_action_schemas:
  database_list:
    description: Run `database list` - list connected databases.
    argv:
      - database
      - list
    parameters:
      - args
    required: []
    parameter_overrides:
      args: &id001
        type: array
        items:
          type: string
        description: |
          Exact argv tokens appended after the fixed command prefix. ONE
          TOKEN PER ELEMENT — a flag and its value are SEPARATE elements:
          ["--can-query", "true"]   ✅
          ["--can-query=true"]      ❌ (joined with `=`)
          ["--can-query"]           ❌ (value missing)
          Value-taking flags such as `--term`, `--can-query`,
          `--data-source`, `--models`, `--export-format`, `--select`,
          `--value`, `--q` ALWAYS require the value as the next element.
          Boolean toggles such as `--compact`, `--agent`, `--stdin` stand
          alone (no value).
      stdin: &id002
        type: string
        description:
          JSON request body to write to stdin for commands that use --stdin. Do not shell-quote or pipe; provide
          the raw JSON string here.
    timeout_secs: 60
  database_get:
    description: Run `database get <id>` - single database details.
    argv:
      - database
      - get
    parameters:
      - args
    required:
      - args
    parameter_overrides:
      args: *id001
    timeout_secs: 60
  database_metadata:
    description: Run `database metadata database <id>` — tables + columns + types for a database.
    argv:
      - database
      - metadata
      - database
    parameters:
      - database_id
      - extra_args
    required:
      - database_id
    parameter_overrides:
      database_id:
        type: integer
        description: Numeric Metabase database id.
      extra_args:
        type: array
        items:
          type: string
        description: Escape hatch — extra argv tokens.
    arg_mappings:
      - type: positional
        param: database_id
      - type: passthrough
        param: extra_args
    timeout_secs: 60
  database_schemas:
    description: Run `database schemas database <id>` - list schema names in a database.
    argv:
      - database
      - schemas
      - database
    parameters:
      - args
    required:
      - args
    parameter_overrides:
      args: *id001
    timeout_secs: 60
  database_schema:
    description: Run `database schema database <id> <schema-name>` - tables in one schema.
    argv:
      - database
      - schema
      - database
    parameters:
      - args
    required:
      - args
    parameter_overrides:
      args: *id001
    timeout_secs: 60
  database_fields:
    description: Run `database fields database <id>` - flat list of all fields across the database.
    argv:
      - database
      - fields
      - database
    parameters:
      - args
    required:
      - args
    parameter_overrides:
      args: *id001
    timeout_secs: 60
  collection_list:
    description: Run `collection list` - list collections.
    argv:
      - collection
      - list
    parameters:
      - args
    required: []
    parameter_overrides:
      args: *id001
    timeout_secs: 60
  collection_tree:
    description: Run `collection tree` - full collection hierarchy. Best overview of how content is organized.
    argv:
      - collection
      - tree
    parameters:
      - args
    required: []
    parameter_overrides:
      args: *id001
    timeout_secs: 60
  collection_get:
    description: Run `collection get <id>` - one collection's metadata.
    argv:
      - collection
      - get
    parameters:
      - args
    required:
      - args
    parameter_overrides:
      args: *id001
    timeout_secs: 60
  collection_root:
    description: Run `collection root` - the root collection.
    argv:
      - collection
      - root
    parameters:
      - args
    required: []
    parameter_overrides:
      args: *id001
    timeout_secs: 60
  collection_root_items:
    description: Run `collection root-items` - items at the top level.
    argv:
      - collection
      - root-items
    parameters:
      - args
    required: []
    parameter_overrides:
      args: *id001
    timeout_secs: 60
  collection_items:
    description: Run `collection items collection <id>` — items inside a collection.
    argv:
      - collection
      - items
      - collection
    parameters:
      - collection_id
      - extra_args
    required:
      - collection_id
    parameter_overrides:
      collection_id:
        type: integer
        description: Numeric Metabase collection id.
      extra_args:
        type: array
        items:
          type: string
        description: Escape hatch — extra argv tokens.
    arg_mappings:
      - type: positional
        param: collection_id
      - type: passthrough
        param: extra_args
    timeout_secs: 60
  dashboard_list:
    description: Run `dashboard list` - list dashboards.
    argv:
      - dashboard
      - list
    parameters:
      - args
    required: []
    parameter_overrides:
      args: *id001
    timeout_secs: 60
  dashboard_get:
    description: Run `dashboard get <id>` — dashboard details + the cards on it.
    argv:
      - dashboard
      - get
    parameters:
      - dashboard_id
      - extra_args
    required:
      - dashboard_id
    parameter_overrides:
      dashboard_id:
        type: integer
        description: Numeric Metabase dashboard id.
      extra_args:
        type: array
        items:
          type: string
        description: Escape hatch — extra argv tokens.
    arg_mappings:
      - type: positional
        param: dashboard_id
      - type: passthrough
        param: extra_args
    timeout_secs: 60
  dashboard_items:
    description: Run `dashboard items dashboard <id>` - items on a dashboard (cards, tabs, links).
    argv:
      - dashboard
      - items
      - dashboard
    parameters:
      - args
    required:
      - args
    parameter_overrides:
      args: *id001
    timeout_secs: 60
  dashboard_query_metadata:
    description: Run `dashboard query-metadata dashboard <id>` - query metadata across all dashboard cards.
    argv:
      - dashboard
      - query-metadata
      - dashboard
    parameters:
      - args
    required:
      - args
    parameter_overrides:
      args: *id001
    timeout_secs: 60
  find_search:
    description: |
      Run `metabase-search` — keyword search across Metabase entities.
      Almost always the right first call when you don't yet know where
      data lives. The `q` parameter is required (the schema enforces
      this) — the old "missing query" failure is impossible now.

      "card" is the legacy name for "dataset" — use "dataset". Saved
      questions are returned under `model: "dataset"`.
    argv:
      - metabase-search
    parameters:
      - q
      - models
      - extra_args
    required:
      - q
    parameter_overrides:
      q:
        type: string
        description: Free-text search query (required).
      models:
        type: string
        description: |
          Comma-separated entity types to restrict the search to. Whole
          value is one string; do NOT split by entity. Canonical values
          (anything else → HTTP 400): dashboard, table, dataset, segment,
          collection, measure, transform, document, database, action,
          indexed-entity.
      extra_args:
        type: array
        items:
          type: string
        description: Escape hatch — extra argv tokens for flags this schema does not yet surface.
    arg_mappings:
      - type: flag
        flag: --q
        param: q
      - type: flag
        flag: --models
        param: models
      - type: passthrough
        param: extra_args
    timeout_secs: 60
  card_list:
    description: |
      Run `card list` — list saved questions. Returns ~5k items on this
      instance; trim with `--select id,name,collection_id,database_id,updated_at`
      to reduce payload.

      There is NO `-f` / `--filter` / `f` flag on `card list`. To find
      cards by name fragment use `metabase-search --q <fragment>
      --models dataset` (saved cards are model="dataset").
    argv:
      - card
      - list
    parameters:
      - args
    required: []
    parameter_overrides:
      args: *id001
    timeout_secs: 60
  card_get:
    description: Run `card get <id>` — saved question details (SQL, parameters, result_metadata). Always inspect before card_run.
    argv:
      - card
      - get
    parameters:
      - card_id
      - extra_args
    required:
      - card_id
    parameter_overrides:
      card_id:
        type: integer
        description: Numeric Metabase card (saved-question) id.
      extra_args:
        type: array
        items:
          type: string
        description: Escape hatch — extra argv tokens.
    arg_mappings:
      - type: positional
        param: card_id
      - type: passthrough
        param: extra_args
    timeout_secs: 60
  card_create:
    description: Run `card create --stdin` - save a new SQL question/card. stdin must include name, display, type, and dataset_query.
    argv:
      - card
      - create
    parameters:
      - args
      - stdin
    required:
      - stdin
    parameter_overrides:
      args: *id001
      stdin: *id002
    suffix_args:
      - --stdin
    timeout_secs: 120
  card_update:
    description: Run `card update <id> --stdin` - update an existing saved question/card, including dataset_query SQL.
    argv:
      - card
      - update
    parameters:
      - args
      - stdin
    required:
      - args
      - stdin
    parameter_overrides:
      args: *id001
      stdin: *id002
    suffix_args:
      - --stdin
    timeout_secs: 120
  card_run:
    description: |
      Run `card query card-run <card-id>` — execute a saved question
      and return rows. Fastest path when a card already answers the
      question.

      If you get HTTP 400 "Error preprocessing query" or HTTP 403
      "missing-required-permissions", the card's underlying database
      is not readable with the current API key. Inspect via
      `card_get` (look at `dataset_query.database`), then either
      request the missing grant or pivot to `dataset_query` against a
      database the key does have access to (use `database_list` to see
      which).
    argv:
      - card
      - query
      - card-run
    parameters:
      - card_id
      - extra_args
    required:
      - card_id
    parameter_overrides:
      card_id:
        type: integer
        description: Numeric Metabase card id to execute.
      extra_args:
        type: array
        items:
          type: string
        description: Escape hatch — extra argv tokens.
    arg_mappings:
      - type: positional
        param: card_id
      - type: passthrough
        param: extra_args
    # 2026-05-23 — `--compact` triggers the query-result-aware slim
    # in helpers.go::compactQueryResult. Without it, this endpoint's
    # response is ~24 KB of column-metadata / fingerprints / insights /
    # results_metadata duplicate / native_form, with the actual rows
    # at the END — which gets chopped by the tool-result cap and the
    # agent never sees data. See ARCHITECTURE/CHANGELOG.
    suffix_args:
      - --compact
    timeout_secs: 120
  card_run_with_body:
    description:
      Run `card query card-run <card-id> --stdin` - execute a parameterized saved question. Provide stdin JSON
      with parameters or other query options.
    argv:
      - card
      - query
      - card-run
    parameters:
      - args
      - stdin
    required:
      - args
      - stdin
    parameter_overrides:
      args: *id001
      stdin: *id002
    # `--compact`: see compactQueryResult in helpers.go.
    suffix_args:
      - --stdin
      - --compact
    timeout_secs: 120
  card_export:
    description: |
      Run `card query card-export <card-id> --export-format <csv|json|xlsx|api>`
      — execute a saved question and return exported bytes. Use for
      large results.

      Same permission caveat as `card_run`: HTTP 400 "Error preprocessing
      query" or 403 means the card's `dataset_query.database` is not
      readable with this key. Inspect via `card get <id>` and pivot to
      `dataset query --stdin` against an accessible database if needed.
    argv:
      - card
      - query
      - card-export
    parameters:
      - args
    required:
      - args
    parameter_overrides:
      args: *id001
    timeout_secs: 120
  card_export_with_body:
    description:
      Run `card query card-export <card-id> --export-format <csv|json|xlsx|api> --stdin` - export a parameterized
      saved question. Provide stdin JSON with parameters or format options.
    argv:
      - card
      - query
      - card-export
    parameters:
      - args
      - stdin
    required:
      - args
      - stdin
    parameter_overrides:
      args: *id001
      stdin: *id002
    suffix_args:
      - --stdin
    timeout_secs: 120
  dataset_query:
    description: |
      Run `dataset query --stdin` — execute ad-hoc native SQL or MBQL.
      Provide stdin JSON: {"database":<id>,"type":"native","native":{"query":"SELECT ..."}}.

      The `database` id must be one this API key has read access to.
      A 403 "missing-required-permissions" means the key cannot read
      that database — list accessible dbs via `database list --agent`
      and pivot to one that holds the same / replicated data.
    argv:
      - dataset
      - query
    parameters:
      - args
      - stdin
    required:
      - stdin
    parameter_overrides:
      args: *id001
      stdin: *id002
    # `--compact`: see compactQueryResult in helpers.go.
    suffix_args:
      - --stdin
      - --compact
    timeout_secs: 120
  dataset_export:
    description:
      Run `dataset export --export-format <csv|json|xlsx|api> --stdin` - execute ad-hoc query and stream exported
      bytes. Use for large result sets.
    argv:
      - dataset
      - export
    parameters:
      - args
      - stdin
    required:
      - stdin
    parameter_overrides:
      args: *id001
      stdin: *id002
    suffix_args:
      - --stdin
    timeout_secs: 180
  dataset_to_native:
    description:
      Run `dataset to-native --stdin` - convert MBQL to native SQL without executing. Useful for seeing the SQL
      Metabase would run.
    argv:
      - dataset
      - to-native
    parameters:
      - args
      - stdin
    required:
      - stdin
    parameter_overrides:
      args: *id001
      stdin: *id002
    suffix_args:
      - --stdin
    timeout_secs: 60
  doctor:
    description: Run `doctor` - auth + connectivity check. Use first if any other action fails unexpectedly.
    argv:
      - doctor
    parameters:
      - args
    required: []
    parameter_overrides:
      args: *id001
    timeout_secs: 30
  raw:
    description:
      "Escape hatch: run exact argv tokens through metabase-pp-cli (no fixed prefix). Use only when no native action
      fits."
    parameters:
      - args
      - stdin
    required:
      - args
    parameter_overrides:
      args: *id001
      stdin: *id002
    skip_tool_name: true
    timeout_secs: 120
  help:
    description: Print metabase-pp-cli help for a subcommand or the top-level CLI.
    parameters:
      - args
    required: []
    parameter_overrides:
      args: *id001
    skip_tool_name: true
    timeout_secs: 15
  card_copy:
    description: Run `card copy card <id>` - copy a saved question/card. Use args for the source card id.
    argv:
      - card
      - copy
      - card
    parameters:
