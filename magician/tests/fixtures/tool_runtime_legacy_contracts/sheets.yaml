name: sheets
version: 0.1.0
description: Read, create, update, format, and share collaborative cloud Google Sheets through an owner-selected Google Workspace account.
parameters:
- name: command
  required: true
  param_type: string
  description: Outer-loop fallback command string after `gws sheets`, for example "+read --spreadsheet ID --range Sheet1!A1:D10". Ignored while implementation.type is primitive.
- name: account
  param_type: string
  description: Google account alias (business, personal, work) — each has separate OAuth credentials in {scope_capability_auth_root}/gws-<account>/
  default: work
- name: timeout_secs
  param_type: integer
  description: Command timeout in seconds
  default: '30'
auth:
  required: true
  setup_command: CLOUDSDK_CONFIG={scope_capability_auth_root}/gws-{account}/cloudsdk GOOGLE_WORKSPACE_CLI_CONFIG_DIR={scope_capability_auth_root}/gws-{account} gws auth login -s gmail,sheets,drive,docs,calendar
  check_command: CLOUDSDK_CONFIG={scope_capability_auth_root}/gws-{account}/cloudsdk GOOGLE_WORKSPACE_CLI_CONFIG_DIR={scope_capability_auth_root}/gws-{account} gws auth status
  reauth_command: CLOUDSDK_CONFIG={scope_capability_auth_root}/gws-{account}/cloudsdk GOOGLE_WORKSPACE_CLI_CONFIG_DIR={scope_capability_auth_root}/gws-{account} gws auth login -s gmail,sheets,drive,docs,calendar
  error_patterns:
  - '401'
  - authError
  - No OAuth client configured
  - Token has been expired or revoked
native_action_schemas:
  read:
    description: |
      Read values from a range in an existing cloud Google Sheet through
      the selected owner account. Typed params enforce required
      `spreadsheet` and `range`.
    argv:
    - sheets
    - +read
    parameters:
    - spreadsheet
    - range
    - format
    - account
    - extra_args
    required:
    - spreadsheet
    - range
    parameter_overrides:
      spreadsheet:
        type: string
        description: Spreadsheet ID (the long token in the sheets URL). Maps to `--spreadsheet`.
      range:
        type: string
        description: A1-notation range, e.g. `Sheet1!A1:D10`. Maps to `--range`.
      format:
        type: string
        enum:
        - json
        - csv
        - table
        description: Output format. Maps to `--format`.
      account: &id002
        type: string
        enum:
        - work
        - personal
        - business
        default: work
        description: Google account alias.
      extra_args:
        type: array
        items:
          type: string
        description: Escape hatch — extra argv tokens for flags this schema does not yet surface.
      args: &id001
        type: array
        items:
          type: string
        description: |
          DEPRECATED — use typed parameters plus `extra_args`. Kept so
          the long-tail args-bag actions in this pack still validate.
    arg_mappings:
    - type: flag
      flag: --spreadsheet
      param: spreadsheet
    - type: flag
      flag: --range
      param: range
    - type: flag
      flag: --format
      param: format
    - type: passthrough
      param: extra_args
  append:
    description: |
      Append row values to a range in a collaborative cloud Google Sheet
      through the selected owner account. Typed params enforce required
      `spreadsheet` and `range`.
    argv:
    - sheets
    - +append
    parameters:
    - spreadsheet
    - range
    - values
    - account
    - extra_args
    required:
    - spreadsheet
    - range
    - values
    parameter_overrides:
      spreadsheet:
        type: string
        description: Target spreadsheet ID. Maps to `--spreadsheet`.
      range:
        type: string
        description: A1-notation range to append into (e.g. `Sheet1!A:D`). Maps to `--range`.
      values:
        type: string
        description: Comma-separated row values (or JSON array, depending on +append helper semantics). Maps to `--values`.
      account: *id002
      extra_args:
        type: array
        items:
          type: string
        description: Escape hatch — extra argv tokens.
    arg_mappings:
    - type: flag
      flag: --spreadsheet
      param: spreadsheet
    - type: flag
      flag: --range
      param: range
    - type: flag
      flag: --values
      param: values
    - type: passthrough
      param: extra_args
  spreadsheets_get:
    description: Inspect metadata and tab ids for a cloud Google Sheet in the selected owner account.
    argv:
    - sheets
    - spreadsheets
    - get
    parameters:
    - args
    - account
    required:
    - args
    parameter_overrides:
      args: *id001
      account: *id002
  spreadsheets_create:
    description: Create a new collaborative cloud Google Sheet in the selected owner account.
    argv:
    - sheets
    - spreadsheets
    - create
    parameters:
    - args
    - account
    required:
    - args
    parameter_overrides:
      args: *id001
      account: *id002
  spreadsheets_batch_update:
    description: Apply structural, formatting, validation, chart, or tab-level changes to a cloud Google Sheet in the selected owner account.
    argv:
    - sheets
    - spreadsheets
    - batchUpdate
    parameters:
    - args
    - account
    required:
    - args
    parameter_overrides:
      args: *id001
      account: *id002
  values_get:
    description: Read one range from a cloud Google Sheet in the selected owner account.
    argv:
    - sheets
    - spreadsheets
    - values
    - get
    parameters:
    - args
    - account
    required:
    - args
    parameter_overrides:
      args: *id001
      account: *id002
  values_update:
    description: Write values to one range in a cloud Google Sheet in the selected owner account.
    argv:
    - sheets
    - spreadsheets
    - values
    - update
    parameters:
    - args
    - account
    required:
    - args
    parameter_overrides:
      args: *id001
      account: *id002
  values_batch_get:
    description: Read multiple ranges from a cloud Google Sheet in the selected owner account.
    argv:
    - sheets
    - spreadsheets
    - values
    - batchGet
    parameters:
    - args
    - account
    required:
    - args
    parameter_overrides:
      args: *id001
      account: *id002
  values_batch_update:
    description: Write multiple ranges in a cloud Google Sheet in the selected owner account.
    argv:
    - sheets
    - spreadsheets
    - values
    - batchUpdate
    parameters:
    - args
    - account
    required:
    - args
    parameter_overrides:
      args: *id001
      account: *id002
  values_clear:
    description: Clear values while retaining formatting in one cloud Google Sheet range in the selected owner account.
    argv:
    - sheets
    - spreadsheets
    - values
    - clear
    parameters:
    - args
    - account
    required:
    - args
    parameter_overrides:
      args: *id001
      account: *id002
  values_batch_clear:
    description: Clear multiple cloud Google Sheet ranges while retaining formatting in the selected owner account.
    argv:
    - sheets
    - spreadsheets
    - values
    - batchClear
    parameters:
    - args
    - account
    required:
    - args
    parameter_overrides:
      args: *id001
      account: *id002
  values_append:
    description: Append rows to a cloud Google Sheet through the low-level API in the selected owner account.
    argv:
    - sheets
    - spreadsheets
    - values
    - append
    parameters:
    - args
    - account
    required:
    - args
    parameter_overrides:
      args: *id001
      account: *id002
  copy_to:
    description: Copy a Google Sheet tab into another cloud spreadsheet in the selected owner account.
    argv:
    - sheets
    - spreadsheets
    - sheets
    - copyTo
    parameters:
    - args
    - account
    required:
    - args
    parameter_overrides:
      args: *id001
      account: *id002
  raw:
    description: 'Escape hatch: run exact argv tokens after `gws sheets` for any Sheets CLI command not listed above.'
    argv:
    - sheets
    parameters:
    - args
    - account
    required:
    - args
    parameter_overrides:
      args: *id001
      account: *id002
  help:
    description: 'Run exact gws help argv. Examples: ["--help"], ["sheets","--help"], ["sheets","+read","--help"].'
    parameters:
    - args
    - account
    required: []
    parameter_overrides:
      args: *id001
      account: *id002
    skip_tool_name: true
  auth_status:
    description: Run `gws auth status` for the selected account.
    argv:
    - auth
    - status
    parameters:
    - args
    - account
    required: []
    parameter_overrides:
      args: *id001
      account: *id002
  auth_login:
    description: Run `gws auth login` for the selected account when re-authentication is explicitly needed.
    argv:
    - auth
    - login
    parameters:
    - args
    - account
    required: []
    parameter_overrides:
      args: *id001
      account: *id002
  auth_setup:
    description: Run `gws auth setup` for first-time OAuth setup.
    argv:
    - auth
    - setup
    parameters:
    - args
    - account
    required: []
    parameter_overrides:
      args: *id001
      account: *id002
implementation:
  type: primitive
  command:
  - 'gws'
  program: 'gws'
  arg_mappings:
  - type: split_positional
    param: command
  content_type: tool_output
  timeout_secs: 30
  env:
    GOOGLE_WORKSPACE_CLI_CONFIG_DIR: '{scope_capability_auth_root}/gws-{account}'
    CLOUDSDK_CONFIG: '{scope_capability_auth_root}/gws-{account}/cloudsdk'
execution:
  requires_browser_session: false
  default_timeout_secs: 30
  categories:
  - spreadsheet
  - google-sheets
  - google-workspace
  - cloud
  - cloud-data
  - collaboration
  - tabular
  composition_category: data_operations
  sandbox: shell
