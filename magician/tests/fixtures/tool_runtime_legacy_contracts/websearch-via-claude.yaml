name: websearch-via-claude
version: 0.1.0
parameters:
- name: query
  required: true
  param_type: string
  description: Research query (natural language)
- name: model
  param_type: string
  description: Claude model to use
  default: claude-haiku-4-5-20251001
- name: max_searches
  param_type: integer
  description: Max web searches Claude can make (controls cost and thoroughness)
  default: '3'
- name: allowed_domains
  param_type: string
  description: Comma-separated list of domains to restrict search to
- name: timeout_secs
  param_type: integer
  description: Request timeout in seconds
  default: '305'
native_action_schemas:
  run:
    description: Run the claude_websearch capability with the arguments selected from this capability guide. Inspect stdout/stderr, update the runtime ledger when useful, and call goal_reached only after the requested result is present.
    parameters:
    - query
    - model
    - max_searches
    - allowed_domains
    - timeout_secs
    required:
    - query
    parameter_overrides:
      query:
        type: string
        description: Research query (natural language)
      model:
        type: string
        description: Claude model to use
        default: claude-haiku-4-5-20251001
      max_searches:
        type: integer
        description: Max web searches Claude can make (controls cost and thoroughness)
        default: '3'
      allowed_domains:
        type: string
        description: Comma-separated list of domains to restrict search to
      timeout_secs:
        type: integer
        description: Request timeout in seconds
        default: '305'
    skip_tool_name: true
    timeout_secs: 305
implementation:
  type: primitive
  command:
  - sh
  - '{skill_runtime_root}/scripts/run.sh'
  env:
    _TOOL_QUERY: '{query}'
    _TOOL_MODEL: '{model}'
    _TOOL_MAX_SEARCHES: '{max_searches}'
    _TOOL_ALLOWED_DOMAINS: '{allowed_domains}'
    _TOOL_TIMEOUT_SECS: '{timeout_secs}'
  timeout_secs: 305
execution:
  requires_browser_session: false
  default_timeout_secs: 305
  categories:
  - web
  - search
  - research
  - llm
  composition_category: web_operations
  sandbox: shell
