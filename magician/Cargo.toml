[package]
name = "magician"
version = "0.7.89"
edition = "2021"
authors = ["MagicBeansAI"]
description = "Magician service"
license = "MIT OR Apache-2.0"

[dependencies]
magicvault-core = { workspace = true }
magicvault-effect = { workspace = true }
magicvault-protocol = { workspace = true }
# Trusted CDP material must never reach websocket dependency payload logs.
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }
magician-app-contract = { path = "../magician-app-contract" }
# Core trait interfaces
magician-core = { path = "../magician-core" }
runtime-core = { path = "../runtime-core" }
magician-mcp-client = { path = "../magician-mcp-client" }
magician-event-taxonomy = { path = "../magician-event-taxonomy" }
magician-pty = { path = "../magician-pty" }
magician-vector-index = { path = "../magician-vector-index" }
magician-storage = { path = "../magician-storage" }
magician-storage-migration = { path = "../magician-storage-migration" }
tool-runtime-core = { workspace = true }
portable-pty = "0.9"
magicllm = { path = "../magicllm" }
magicutor = { path = "../magicutor" }
magician-decision = { path = "../magician-decision" }
decision-engine-contract = { path = "../decision-engine-contract", features = ["client"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml = { workspace = true }
schemars = { version = "1.2.1", features = ["chrono04"] }
unicode-normalization = { workspace = true }
base64 = { workspace = true }

# Web framework
actix = "0.13"
actix-web = { version = "4.4", features = ["rustls"] }
actix-web-actors = "4.3"
actix-files = "0.6"
actix-multipart = "0.6"

chrono = { workspace = true }
chrono-tz = "0.10"
cron = "0.12"

# Streaming support
futures-util = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1.0"
parking_lot = { version = "0.12", features = ["arc_lock"] }
hound = "3"

# HTTP client
reqwest = { version = "0.12.28", features = ["json", "stream", "rustls-tls", "multipart", "system-proxy"] }

# Shell expansion for environment variables
shellexpand = "3.1"

# OpenAPI support
openapiv3 = "2.0"

# URL parsing
url = "2.4"
# Public-suffix registrable domains for verification-code sender matching (secure HITL P6).
psl = "2"
urlencoding = "2.1"
# Device enrollment QR codes are rendered inside Magician so the one-time
# secret is never sent to a third-party image service.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Deterministic syndication discovery for user-defined feeds. The parser
# normalizes RSS, Atom, and JSON Feed into one model; sanitization removes
# unsafe feed-provided markup before it enters the candidate contract.
feed-rs = { version = "2.4.0", features = ["sanitize"] }

# In-memory ZIP bundling for the task Portable Export endpoint. Already in the
# build graph transitively (Cargo.lock), so this direct dep adds no new C deps.
# Sync API — driven inside spawn_blocking. `deflate` only (no bzip2/zstd/aes).
zip = { version = "6", default-features = false, features = ["deflate"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Unified-diff computation for `FileEditTransaction` — used by the
# new `execution::file_edit::diff` module to render diffs from
# `(old_text, new_text)` without shelling to `git diff`. Pure text
# diffing; produces standard unified-diff output that the frontend
# `DiffStrip` component renders.
similar = "2"

# Configuration
config = "0.14"
dotenvy = "0.15"
dirs = "5.0"

# ANSI escape stripping for PTY-lane subscription dispatch (cli_template/pty_lane.rs).
# When we drive Claude/Codex/Gemini through their interactive TUI to use the host's
# subscription quota, the captured PTY bytes include ANSI escapes, cursor moves, and
# alt-screen sequences. strip-ansi-escapes removes them so the response surface is plain
# text. Used only by the PTY lane; the legacy `-p`/`exec` lane returns clean JSON.
strip-ansi-escapes = "0.2"

# Ordered maps (needed by openapiv3)
indexmap = { version = "2.0", features = ["serde"] }

# Ultra-fast data structures
# Cloudflare Access assertions are RS256; verifying one by hand would mean
# implementing RSA signature checking, which is not a thing to hand-roll.
jsonwebtoken = "9"
once_cell = "1.19"
# Unix process-group signalling: take down a dev server's whole forked tree
# (npm/vite -> node workers) on stop, not just the launcher pid.
libc = "0.2"

# Skills loader — resolve binaries on PATH for `requires.bins` enforcement
which = "6"

# CLI parsing
clap = { version = "4.0", features = ["derive"] }

# UUID generation
uuid = { workspace = true, features = ["v4", "serde"] }

# ULID generation for time-sortable agent-update IDs
ulid = { version = "1", features = ["serde"] }

# Semantic versioning
semver = "1.0"

# Image processing for SoM screenshot annotation lives in the
# `magician-image` workspace crate (see [dependencies] above).

# File system operations
glob = "0.3"
fs2 = "0.4"

# User context and system information
whoami = "1.5"
sysinfo = "0.30"
# Embedded JS for Magician-owned custom-surface workers only. The engine
# lives in the spawned OS child; the UI iframe stays no-script.
boa_engine = { version = "0.20", default-features = false }

serde_json_path = "0.7"
dashmap = "5.5"

# Parse the bounded LLM fact-query escape hatch into an AST before executing it.
# The visitor feature lets us fail closed on non-registry relations and table
# functions instead of relying on token scanning.
sqlparser = { version = "0.59", features = ["visitor"] }

# Parameter substitution
regex = "1.10"
aho-corasick = "1.1"
sha2 = "0.10"
hmac = "0.12"
blake3 = { workspace = true }

# Security and credential protection
secrecy = { version = "0.8", features = ["serde"] }
zeroize = { version = "1.7", features = ["derive"] }
keyring = "2.3"
aes-gcm = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
hex = "0.4"

# Database support
# PINNED EXACTLY: the bundled DuckDB defines the on-disk storage format of
# analytics.duckdb. A loose range (e.g. "1.2") let `cargo update` silently bump
# the bundled DuckDB (1.5.0 → 1.5.2), whose storage the new lib couldn't read —
# orphaning every scope's analytics DB. Bump this ONLY in a deliberate PR that
# also runs the analytics migration (see docs/runbooks + `make analytics-export` /
# `make analytics-import`).
duckdb = { version = "=1.10502.0", features = ["bundled", "json", "parquet"] }
# The app registry contains personal app records, indexes, provenance, import
# staging and recovery journals.  SQLCipher is the storage boundary so the
# database, WAL and temporary pages share one authenticated-at-rest posture.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "hooks"] }

# Decimal arithmetic for financial calculations
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
tempfile = { version = "3.8", optional = true }
static_assertions = { version = "1", optional = true }
wiremock = { version = "0.5", optional = true }

[features]
# Test-only fixtures shared with satellite crates' test builds.
test-fixtures = ["dep:tempfile", "dep:static_assertions", "dep:wiremock", "magicvault-core/test-fixtures"]

[dev-dependencies]
# Live memory replay uses the same registry initialization as the service.
magician-chunking = { path = "../magician-chunking" }
# The engine process, served on a temp socket so the step judges can be
# checked over the service transport against the same goldens.
decision-engine = { path = "../decision-engine" }
magicvault-core = { workspace = true, features = ["test-fixtures"] }
magician-api = { path = "../magician-api" }
magician-apps = { path = "../magician-apps", features = ["test-fixtures"] }
magician-media = { path = "../magician-media", features = ["test-fixtures"] }
magician-surfaces = { path = "../magician-surfaces", features = ["test-fixtures"] }
magician-comms = { path = "../magician-comms" }
anyhow = { workspace = true }
async-trait = { workspace = true }
static_assertions = "1"
magician-vector-index = { path = "../magician-vector-index", features = ["test-hash-embeddings"] }
# Test binaries never run the startup builder that installs the process-global
# PromptManager, so without this every prompt-backed test fails on a manager
# that was never set. Dev-only: a release build resolves magician-core without
# it. See magician-core/src/prompts/manager.rs.
magician-core = { path = "../magician-core", features = ["test-support"] }
tokio-test = "0.4"
tempfile = "3.8"
wiremock = "0.5"
actix-rt = "2.9"
actix-test = "0.1"
tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
bytes = "1.0"
ring = "0.17.14"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework = "3.7"
security-framework-sys = "2.17"
