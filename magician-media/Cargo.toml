[package]
name = "magician-media"
version = "0.1.5"
edition = "2021"
authors = ["MagicBeansAI"]
description = "The media plane — voice orchestration, streaming STT, fluid audio, runtime config, providers — extracted from the magician monolith"
license = "MIT OR Apache-2.0"

[features]
test-fixtures = ["dep:wiremock"]

[dependencies]
magician = { path = "../magician" }
magician-learning = { path = "../magician-learning" }
magicllm = { path = "../magicllm" }
wiremock = { version = "0.5", optional = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
actix = "0.13"
base64 = { workspace = true }
bytes = "1.0"
blake3 = "1.0"
chrono = { workspace = true }
chrono-tz = "0.9"
dashmap = "5.5"
futures-util = { workspace = true }
once_cell = "1.19"
hound = "3.5"
parking_lot = "0.12"
regex = "1.10"
reqwest = { version = "0.12.28", features = ["json", "stream", "rustls-tls", "multipart", "system-proxy"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
sha2 = "0.10"
sysinfo = "0.30"
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = "0.7"
tracing = { workspace = true }
url = "2.4"
urlencoding = "2.1"
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
magician = { path = "../magician", features = ["test-fixtures"] }
tempfile = "3.8"
wiremock = "0.5"
