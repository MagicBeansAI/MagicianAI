[package]
name = "magician-storage-migration"
version = "0.1.0"
edition = "2021"
publish = false
authors = ["MagicBeansAI"]
description = "Dormant owner-closure and migration coordinator. Not used by default startup."
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
magician-storage = { path = "../magician-storage" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync"] }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
