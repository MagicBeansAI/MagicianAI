# Project-wide Gradle settings

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Build performance
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3072m
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
# Rescan CLI edits instead of trusting a long-lived daemon's filesystem events.
org.gradle.vfs.watch=false

# Android build
android.nonTransitiveRClass=true

# Device tests may run on an owner's paired phone. Keep the installed app and
# its encrypted settings after instrumentation instead of uninstalling it.
android.injected.androidTest.leaveApksInstalledAfterRun=true

org.gradle.java.installations.auto-detect=false
