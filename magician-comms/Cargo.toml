[package]
name = "magician-comms"
version = "0.1.7"
edition = "2021"
authors = ["MagicBeansAI"]
description = "The comms data plane (channel-assist), extracted from the magician monolith"
license = "MIT OR Apache-2.0"

[dependencies]
magician = { path = "../magician" }
runtime-core = { path = "../runtime-core" }
libc = "0.2"
magicllm = { path = "../magicllm" }
magician-media = { path = "../magician-media" }
magician-surfaces = { path = "../magician-surfaces" }
magician-vector-index = { path = "../magician-vector-index" }

actix-web = { version = "4.4", features = ["rustls"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.9"
duckdb = { version = "=1.10502.0", features = ["bundled", "json"] }
fs2 = "0.4"
futures-util = { workspace = true }
once_cell = "1.19"
regex = "1.10"
reqwest = { version = "0.12.28", features = ["json", "stream", "rustls-tls", "multipart", "system-proxy"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml = "0.9"
serde_json = { workspace = true }
sha2 = "0.10"
tempfile = "3.8"
wiremock = { version = "0.5", optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = "0.7"
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
urlencoding = "2.1"

[features]
# Test-only fixtures shared with satellite crates' test builds — the same
# pattern `magician` uses. Declared because 78 sites in this crate already gate
# on it: without the declaration the cfg can never be true outside `cfg(test)`,
# so those fixtures were unreachable to any other crate (which is the entire
# point of the feature), and rustc warned `unexpected cfg condition value` at
# every one of them.
#
# Both entries are load-bearing, and each was found by compiling with the
# feature on rather than by reading:
#   `dep:wiremock`          — retained from the pre-relocation engine (the
#                             wiremock-gated block lived in
#                             `channel_assist/centrality.rs`, which moved
#                             lib-side with plan workstream 3.0; keeping the
#                             entry preserves the feature's build surface).
#   `magician/test-fixtures` — the comms-side resurfacing modules
#                             (`actions.rs`, `interaction.rs`) import
#                             `magician::magician_v2::test_support`, which only
#                             exists when magician's own fixtures are on, and
#                             the lib-resident engine's fixture blocks need the
#                             propagation too. A feature that does not
#                             propagate is a feature that cannot compile.
# `tempfile` needs no entry — it is already a hard dependency.
test-fixtures = ["dep:wiremock", "magician/test-fixtures"]

[dev-dependencies]
dotenvy = "0.15"
magician-chunking = { path = "../magician-chunking" }
wiremock = "0.5"
magician = { path = "../magician", features = ["test-fixtures"] }
tempfile = "3.8"
actix-rt = "2.9"
