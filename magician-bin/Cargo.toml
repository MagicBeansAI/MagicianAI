[package]
name = "magician-bin"
version = "0.2.20"
edition = "2021"
authors = ["MagicBeansAI"]
description = "The magician server binary, extracted from the magician monolith package"
license = "MIT OR Apache-2.0"

[[bin]]
name = "magician"
path = "src/main.rs"

[dependencies]
magician = { path = "../magician" }
magician-storage = { path = "../magician-storage" }
magician-api = { path = "../magician-api" }
magician-apps = { path = "../magician-apps" }
magician-surfaces = { path = "../magician-surfaces" }
magician-media = { path = "../magician-media" }
magician-learning = { path = "../magician-learning" }
magician-chunking = { path = "../magician-chunking" }
magician-comms = { path = "../magician-comms" }
runtime-core = { path = "../runtime-core" }
magicllm = { path = "../magicllm" }
tool-runtime-core = { workspace = true }

actix-files = "0.6"
actix-http = "3.12"
actix-service = "2"
actix-web = { version = "4.4", features = ["rustls"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { version = "4.0", features = ["derive"] }
chrono = { workspace = true }
libc = "0.2"
reqwest = { version = "0.12.28", features = ["json", "stream", "rustls-tls", "multipart", "system-proxy"] }
duckdb = { version = "=1.10502.0", features = ["bundled", "json", "parquet"] }
dotenvy = "0.15"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = "0.7"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
actix = "0.13"
actix-web-actors = "4.3"
futures-util = { workspace = true }
tokio-tungstenite = "0.21"
# The working-set live eval (examples/) reads the deterministic suite's
# fixtures, which ship only under `test-fixtures`. Resolver 2 keeps this
# feature out of the runtime binary's own build.
magician = { path = "../magician", features = ["test-fixtures"] }
# tests/execution_harness_contract.rs compiles magician's turn_engine.rs by
# path, and it renders its preamble through magician-core's prompt store; a
# test binary never installs the process-global PromptManager, so
# `test-support` lets it fall back to the on-disk store (as magician's own
# dev-dependency does).
magician-core = { path = "../magician-core", features = ["test-support"] }
once_cell = "1.19"
parking_lot = { version = "0.12", features = ["arc_lock"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "hooks"] }
tokio = { workspace = true, features = ["test-util"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest13 = { package = "reqwest", version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
schemars = { version = "1.2.1", features = ["chrono04"] }
serde_yaml = { workspace = true }
tempfile = "3.8"
