[package]
name = "document-to-markdown-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Standalone AnyDoc document-to-Markdown command-line adapter"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "document-to-markdown"
path = "src/main.rs"

[dependencies]
anydoc = "=0.1.7"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = "3"
