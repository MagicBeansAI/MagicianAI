[package]
name = "magicllm"
version = "0.2.46"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Shared multi-provider LLM abstraction for Magician platform services"
repository = "https://github.com/magicbeanbs100x/magician"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive", "rc"] }
serde-json = { package = "serde_json", version = "1" }
thiserror = "1"
tracing = "0.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream", "system-proxy"] }
futures-util = "0.3"
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
dashmap = "5"
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rand = "0.8"
parking_lot = "0.12"
async-channel = "2"
blake3 = { workspace = true }
runtime-core = { path = "../runtime-core" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
wiremock = "0.5"
tempfile = "3.8"
