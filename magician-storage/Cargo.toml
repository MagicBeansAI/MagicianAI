[package]
name = "magician-storage"
version = "0.1.0"
edition = "2021"
authors = ["MagicBeansAI"]
description = "Typed storage identifiers, errors, profiles, and capability traits"
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true }
bytes = "1"
chrono = { workspace = true, features = ["serde"] }
fs4 = { version = "0.8", features = ["sync"] }
futures-core = "0.3"
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "process"] }
