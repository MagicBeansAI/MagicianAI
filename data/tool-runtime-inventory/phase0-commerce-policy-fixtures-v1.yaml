schema_version: tool-runtime.commerce-policy-fixtures-manifest.v1
commerce_boundary_schema_version: tool-runtime.commerce-boundary.v1
cases:
  - integration: swiggy-mcp
    id: amount-required
    tool_name: place_food_order
    provided_risk: checkout_or_payment
    expected: { inferred_risk: checkout_or_payment, effective_risk: checkout_or_payment, terminal: missing_declared_amount }
  - integration: swiggy-mcp
    id: budget-ceiling
    tool_name: place_food_order
    provided_risk: checkout_or_payment
    declared_amount_paise: 10000
    cart: { kind: verified, raw_amount: 100, unit: rupees }
    reservation: ceiling_exceeded
    expected: { inferred_risk: checkout_or_payment, effective_risk: checkout_or_payment, terminal: budget_ceiling_exceeded, verified_amount_paise: 10000 }
  - integration: swiggy-mcp
    id: budget-missing
    tool_name: place_food_order
    provided_risk: checkout_or_payment
    declared_amount_paise: 10000
    cart: { kind: verified, raw_amount: 100, unit: rupees }
    reservation: budget_not_configured
    expected: { inferred_risk: checkout_or_payment, effective_risk: checkout_or_payment, terminal: budget_not_configured, verified_amount_paise: 10000 }
  - integration: swiggy-mcp
    id: budget-unavailable-allowed
    tool_name: place_food_order
    provided_risk: checkout_or_payment
    declared_amount_paise: 10000
    cart: { kind: verified, raw_amount: 100, unit: rupees }
    gate_fail_open: true
    reservation: unavailable
    expected: { inferred_risk: checkout_or_payment, effective_risk: checkout_or_payment, terminal: remote_success, verified_amount_paise: 10000, remote_called: true }
  - integration: swiggy-mcp
    id: budget-unavailable-blocked
    tool_name: place_food_order
    provided_risk: checkout_or_payment
    declared_amount_paise: 10000
    cart: { kind: verified, raw_amount: 100, unit: rupees }
    reservation: unavailable
    expected: { inferred_risk: checkout_or_payment, effective_risk: checkout_or_payment, terminal: budget_unavailable, verified_amount_paise: 10000 }
  - integration: swiggy-mcp
    id: cart-mismatch-fail-closed
    tool_name: place_food_order
    provided_risk: checkout_or_payment
    declared_amount_paise: 10000
    cart: { kind: verified, raw_amount: 200, unit: rupees }
    gate_fail_open: true
    allow_unverified_cart: true
    expected: { inferred_risk: checkout_or_payment, effective_risk: checkout_or_payment, terminal: cart_mismatch }
  - integration: swiggy-mcp
    id: cart-paise-success
    tool_name: place_food_order
    provided_risk: checkout_or_payment
    declared_amount_paise: 10000
    cart: { kind: verified, raw_amount: 10000, unit: paise }
    expected: { inferred_risk: checkout_or_payment, effective_risk: checkout_or_payment, terminal: remote_success, verified_amount_paise: 10000, reservation_acquired: true, remote_called: true, settlement: commit }
  - integration: swiggy-mcp
    id: cart-rupees-success
    tool_name: place_food_order
    provided_risk: checkout_or_payment
    declared_amount_paise: 10000
    cart: { kind: verified, raw_amount: 100, unit: rupees }
    expected: { inferred_risk: checkout_or_payment, effective_risk: checkout_or_payment, terminal: remote_success, verified_amount_paise: 10000, reservation_acquired: true, remote_called: true, settlement: commit }
  - integration: swiggy-mcp
    id: cartless-allowed
    tool_name: place_food_order
    provided_risk: checkout_or_payment
    declared_amount_paise: 10000
    cart: { kind: unavailable, reason: no_cart_tool }
    gate_fail_open: true
    expected: { inferred_risk: checkout_or_payment, effective_risk: checkout_or_payment, terminal: remote_success, verified_amount_paise: 10000, reservation_acquired: true, remote_called: true, settlement: commit }
