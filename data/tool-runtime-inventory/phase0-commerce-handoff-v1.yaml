auth:
  credential_delivery: sealed_transport_config
  policy_receipt: non_secret_binding_receipt
  authorization_independent: true
  binding_dimensions: [principal, workspace, skill, profile, endpoint, issuer]
  credential_values_visible_to_policy: false
  global_environment_mutated: false

routing:
  selection_dimensions: [principal, workspace, skill, profile]
  rollout_states: [legacy, compare, generic_canary, generic, rollback]
  route_snapshot: pinned_per_invocation
  rollback_effect: future_invocations_only
  credential_migration: never
  compare_remote_calls: 1
  automatic_fallback_after_dispatch: false
  validated_legacy_contract_required: true
  kill_switches: global_and_per_skill

continuation:
  input_required: retain_until_terminal
  task: retain_until_terminal
  resume_deadline: required_bounded
  fallback_while_pending: forbidden
  input_required_restart: session_bound_fail_closed
  task_restart: durable_exact_revalidation
  recovery_revision: durable_replace_before_dispatch

refund:
  current_coverage: absent
  migration_readiness: blocked_pending_design
  execution: unsupported_fail_closed
  automatic_refund: false

migration:
  production_routing: disabled
  contract_status: contract_only
  blockers:
    - auth_broker_runtime
    - dispatch_phase_evidence
    - input_required_resume
    - task_resume
    - refund_design

integrations:
  - id: swiggy-mcp
    legacy_target: legacy_wrapper
    generic_target: official_sdk
    legacy_credential_owner: legacy_skill_cache
    generic_credential_owner: auth_broker_scoped_store
    commerce_policy_owner: governed_commerce_policy
  - id: zepto-mcp
    legacy_target: legacy_wrapper
    generic_target: official_sdk
    legacy_credential_owner: legacy_skill_cache
    generic_credential_owner: auth_broker_scoped_store
    commerce_policy_owner: governed_commerce_policy

scenarios:
  - id: auth-binding-mismatch
    auth: binding_mismatch
    expected:
      target: official_sdk
      terminal: auth_binding_mismatch
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
  - id: auth-cancelled
    auth: cancelled
    expected:
      target: official_sdk
      terminal: auth_cancelled
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
  - id: auth-expired
    auth: expired
    expected:
      target: official_sdk
      terminal: auth_expired
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
  - id: auth-identity-mismatch
    auth: identity_mismatch
    expected:
      target: official_sdk
      terminal: auth_identity_mismatch
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
  - id: auth-interaction-required
    auth: interaction_required
    expected:
      target: official_sdk
      terminal: auth_interaction_required
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
  - id: auth-issuer-changed
    auth: issuer_changed
    expected:
      target: official_sdk
      terminal: auth_issuer_changed
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
  - id: auth-scope-upgrade
    auth: scope_upgrade_required
    expected:
      target: official_sdk
      terminal: auth_scope_upgrade_required
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
  - id: auth-timeout
    auth: timed_out
    expected:
      target: official_sdk
      terminal: auth_timed_out
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
  - id: authorization-denied
    authorization: denied
    expected:
      target: official_sdk
      terminal: authorization_denied
  - id: cancel-after-send
    dispatch: cancelled_after_send
    expected:
      target: official_sdk
      terminal: remote_ambiguous
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
      remote_called: true
      settlement: commit
  - id: cancel-before-send
    dispatch: cancelled_before_send
    expected:
      target: official_sdk
      terminal: cancelled_before_dispatch
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
      settlement: rollback
  - id: dropped-after-send
    dispatch: dropped_after_send
    expected:
      target: official_sdk
      terminal: remote_ambiguous
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
      remote_called: true
      settlement: commit
  - id: input-required-retain
    dispatch: input_required
    expected:
      target: official_sdk
      terminal: input_required
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
      remote_called: true
      settlement: retain
  - id: malformed-after-send
    dispatch: malformed_response_after_send
    expected:
      target: official_sdk
      terminal: remote_ambiguous
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
      remote_called: true
      settlement: commit
  - id: policy-denied
    policy: denied
    expected:
      target: official_sdk
      terminal: policy_denied
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
  - id: refund-blocked
    policy: refund_intent
    expected:
      target: official_sdk
      terminal: refund_migration_blocked
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
  - id: remote-auth-required
    dispatch: authorization_required
    expected:
      target: official_sdk
      terminal: remote_authorization_required
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
      remote_called: true
      settlement: rollback
  - id: remote-error
    dispatch: complete_remote_error
    expected:
      target: official_sdk
      terminal: remote_error
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
      remote_called: true
      settlement: rollback
  - id: remote-success-reserved
    dispatch: complete_success
    expected:
      target: official_sdk
      terminal: remote_success
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
      remote_called: true
      settlement: commit
  - id: remote-success-unreserved
    policy: ready_unreserved
    dispatch: complete_success
    expected:
      target: official_sdk
      terminal: remote_success
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
      remote_called: true
  - id: route-canary-generic
    rollout_state: generic_canary
    canary_selected: true
    expected:
      target: official_sdk
      terminal: remote_success
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
      remote_called: true
      settlement: commit
  - id: route-canary-legacy
    rollout_state: generic_canary
    expected:
      target: legacy_wrapper
      terminal: legacy_delegated
      credential_owner: legacy_skill_cache
  - id: route-compare
    rollout_state: compare
    expected:
      target: legacy_wrapper
      terminal: legacy_delegated
      credential_owner: legacy_skill_cache
      shadow_policy_only: true
  - id: route-generic
    rollout_state: generic
    expected:
      target: official_sdk
      terminal: remote_success
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
      remote_called: true
      settlement: commit
  - id: route-generic-missing
    rollout_state: generic
    generic_contract_available: false
    expected:
      target: official_sdk
      terminal: route_unavailable
  - id: route-legacy
    rollout_state: legacy
    expected:
      target: legacy_wrapper
      terminal: legacy_delegated
      credential_owner: legacy_skill_cache
  - id: route-legacy-missing
    rollout_state: legacy
    legacy_contract_available: false
    expected:
      target: legacy_wrapper
      terminal: route_unavailable
  - id: route-rollback
    rollout_state: rollback
    expected:
      target: legacy_wrapper
      terminal: legacy_delegated
      credential_owner: legacy_skill_cache
  - id: task-accepted-retain
    dispatch: task_accepted
    expected:
      target: official_sdk
      terminal: task_pending
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
      remote_called: true
      settlement: retain
  - id: timeout-after-send
    dispatch: timeout_after_send
    expected:
      target: official_sdk
      terminal: remote_ambiguous
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
      remote_called: true
      settlement: commit
  - id: transport-after-send
    dispatch: transport_failure_after_send
    expected:
      target: official_sdk
      terminal: remote_ambiguous
      credential_owner: auth_broker_scoped_store
      auth_broker_called: true
      remote_called: true
      settlement: commit
